# Importe dans l'appli les visuels Canva validés.
# Claude dépose la liste des visuels dans a-importer.json : [{"fichier":"ev-xxxxxxxxxx.jpg","url":"https://…"}]
# Ce robot télécharge chaque image, crée la grande version (640×1137) et la vignette (200×355),
# les enregistre dans l'appli puis vide la liste (les visuels en échec y restent).
name: Importer les visuels
on:
  push:
    branches: [main]
    paths: [a-importer.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency: importer-visuels
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et redimensionner
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import json, re, urllib.request, io, sys
          from PIL import Image, ImageOps
          liste = json.load(open("a-importer.json", encoding="utf-8"))
          erreurs, restants = [], []
          for item in liste:
              nom, url = item["fichier"], item["url"]
              if not re.fullmatch(r"ev-[0-9a-z]{10}\.jpg", nom) or not url.startswith("https://"):
                  erreurs.append(f"{nom} : nom ou lien invalide"); restants.append(item); continue
              try:
                  data = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "agenda-chansigne"}), timeout=60).read()
                  im = ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert("RGB")
              except Exception as e:
                  erreurs.append(f"{nom} : {e}"); restants.append(item); continue
              ImageOps.fit(im, (640, 1137), Image.LANCZOS).save(nom, "JPEG", quality=82, optimize=True, progressive=True)
              ImageOps.fit(im, (200, 355), Image.LANCZOS).save(nom.replace("ev-", "th-", 1), "JPEG", quality=78, optimize=True)
              print("OK", nom)
          json.dump(restants, open("a-importer.json", "w"), ensure_ascii=False, indent=1)
          if erreurs:
              print("\n".join(erreurs)); sys.exit(1)
          PY
      - name: Enregistrer dans l'appli
        if: always()
        run: |
          git config user.name "Robot Agenda"
          git config user.email "actions@users.noreply.github.com"
          git add -A ev-*.jpg th-*.jpg a-importer.json
          git diff --cached --quiet || (git commit -m "Visuels importés depuis Canva" && git push)
