<style>
  :root{
    --bg:#d9f0f2;
    --surface:#ffffff;
    --surface-2:#c3e6e9;
    --ink:#3b2013;
    --muted:#6e5a47;
    --line:#b3dade;
    --accent:#d33d27;
    --accent-text:#b3321f;
    --accent-ink:#ffffff;
    --accent-2:#f0a028;
    --accent-2-ink:#3b2013;
    --teal:#8fc7bc;
    --teal-deep:#2f7468;
    --shadow: 0 1px 2px rgba(59,32,19,.08), 0 8px 24px -12px rgba(59,32,19,.24);
    --font-display:'Avenir Next Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue Condensed',system-ui,sans-serif;
    --font-body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a2226;
      --surface:#123033;
      --surface-2:#163a3d;
      --ink:#fbefe0;
      --muted:#cbaf94;
      --line:#1f4a4e;
      --accent:#ff6a4d;
      --accent-text:#ff6a4d;
      --accent-ink:#2b0d04;
      --accent-2:#ffb648;
      --accent-2-ink:#2c1c05;
      --teal:#8fc7bc;
      --teal-deep:#3f8f83;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a2226;
    --surface:#123033;
    --surface-2:#163a3d;
    --ink:#fbefe0;
    --muted:#cbaf94;
    --line:#1f4a4e;
    --accent:#ff6a4d;
      --accent-text:#ff6a4d;
    --accent-ink:#2b0d04;
    --accent-2:#ffb648;
    --accent-2-ink:#2c1c05;
    --teal:#8fc7bc;
    --teal-deep:#3f8f83;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  a{color:inherit;}
  img{display:block;}

  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px 14px;
    max-width:640px;margin:0 auto;
  }
  .mark{
    width:46px;height:46px;border-radius:13px;flex:none;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(224,67,44,.35);
  }
  .mark img{width:100%;height:100%;object-fit:cover;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:21px;
    letter-spacing:.2px;
    margin:0;
    line-height:1.1;
  }
  .brand p{
    margin:1px 0 0;
    font-size:14.5px;
    color:var(--muted);
    letter-spacing:.2px;
  }

  main{max-width:640px;margin:0 auto;padding:0 16px;}

  /* Hero: next concert */
  .hero{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:var(--accent);
    color:#fff;
    margin:6px 0 28px;
    box-shadow:var(--shadow);
    min-height:220px;
  }
  .hero-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center top;
    filter:saturate(1.05);
  }
  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(59,20,10,.12) 0%, rgba(43,13,4,.55) 38%, rgba(43,13,4,.86) 62%, rgba(43,13,4,.95) 100%);
  }
  .hero-noimg{
    position:absolute;inset:0;
    background:
      radial-gradient(130% 150% at 12% -10%, var(--accent-2) 0%, transparent 55%),
      linear-gradient(155deg,var(--accent),#a82a1a 75%);
  }
  .hero-confetti{
    position:absolute;top:16px;left:16px;display:flex;gap:6px;align-items:center;
    opacity:.85;pointer-events:none;
  }
  .hero-confetti span{display:block;width:6px;height:6px;border-radius:50%;background:#fff;}
  .hero-confetti span:nth-child(2){background:var(--accent-2);width:8px;height:8px;}
  .hero-confetti span:nth-child(3){background:var(--teal);width:5px;height:5px;}
  .hero-doodle{
    position:absolute;top:14px;right:14px;width:60px;height:auto;
    opacity:.5;pointer-events:none;
  }
  .hero-inner{
    position:relative;padding:20px 20px 20px;
    display:flex;flex-direction:column;min-height:220px;
  }
  .hero-eyebrow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .hero-eyebrow{
    font-size:13.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:#ffe6c2;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(43,13,4,.82);padding:5px 11px;border-radius:999px;
  }
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 4px rgba(240,160,40,.35);}
  .hero-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(31px,8vw,41px);
    line-height:1;
    margin:10px 0 6px;
    text-wrap:balance;
  }
  .hero-meta{
    font-size:16.5px;
    color:#fff0e2;
    display:flex;flex-wrap:wrap;gap:x;
    row-gap:4px;
  }
  .hero-meta span:not(:last-child)::after{content:"·";margin:0 7px;color:#f0b39e;}
  .hero-actions{margin-top:auto;padding-top:16px;display:flex;gap:10px;flex-wrap:wrap;}

  .btn{
    appearance:none;border:none;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--font-body);font-weight:700;font-size:16.5px;
    padding:11px 18px;border-radius:100px;cursor:pointer;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent-2);color:var(--accent-2-ink);}
  .btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);}

  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
    padding-top:2px;
  }

  .month{margin-bottom:26px;}
  .month-head{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    padding:10px 0 8px;
    display:flex;align-items:baseline;gap:10px;
  }
  .month-head h2{
    font-family:var(--font-display);
    font-weight:800;
    font-size:27px;
    margin:0;
    letter-spacing:.2px;
    color:var(--accent-text);
  }
  .month-head .count{
    font-size:14.5px;color:var(--muted);font-weight:600;
  }

  .cards{display:flex;flex-direction:column;gap:10px;}

  .card{
    display:flex;gap:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  .card-date{
    flex:none;width:52px;text-align:center;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
  }
  .card-date .d{
    font-family:var(--font-display);
    font-weight:800;font-size:29px;line-height:1;
    color:var(--accent-text);
    font-variant-numeric:tabular-nums;
  }
  .card-date .y{font-size:12px;font-weight:600;color:var(--muted);line-height:1.1;}
  .card-date .m{
    font-size:12.5px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);
  }
  .card-img{
    flex:none;width:76px;height:76px;border-radius:12px;
    background:var(--surface-2);object-fit:cover;
    border:1px solid var(--line);
  }
  /* Affiche entière (format 9:16) : elle occupe toute la hauteur de la carte,
     jusqu'au bouton Réserver, sans être coupée en carré. */
  img.card-img{align-self:stretch;height:auto;min-height:135px;object-position:center top;}
  .card-img.placeholder{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:25px;
    color:var(--muted);
  }
  .card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center;}
  .card-artist{
    font-family:var(--font-display);
    font-weight:700;font-size:20px;line-height:1.15;
    overflow-wrap:anywhere;
  }
  .card-venue{
    font-size:15.5px;color:var(--muted);line-height:1.3;
    overflow-wrap:anywhere;
    display:flex;align-items:flex-start;gap:4px;
  }
  .card-venue-name{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.25;overflow-wrap:anywhere;}
  .card-date .t{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:5px;text-align:center;overflow-wrap:anywhere;}
  .card-note{font-size:14.5px;color:var(--muted);line-height:1.3;font-style:italic;}
  .hero-meta-stack .hero-hour{font-weight:700;}
  .card-time{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3;display:flex;align-items:center;gap:4px;}
  .card-time .clock{width:12px;height:12px;flex:none;color:var(--accent-2);}
  .hero-meta-stack{flex-direction:column;align-items:flex-start;row-gap:2px;}
  .hero-meta-stack span:not(:last-child)::after{content:none;}
  .hero-meta-stack span:first-child{font-weight:700;}
  .card-venue .pin{margin-top:3px;}
  .card-venue .pin{width:11px;height:11px;flex:none;color:var(--accent-2);}
  .card-cta{
    appearance:none;border:none;font-family:var(--font-body);cursor:pointer;
    margin-top:7px;
    display:inline-flex;align-items:center;gap:5px;
    font-size:14.5px;font-weight:700;color:var(--accent-2-ink);
    background:var(--accent-2);
    padding:5px 12px 5px 10px;border-radius:100px;
    text-decoration:none;width:fit-content;
  }
  .card-cta svg{width:12px;height:12px;flex:none;}
  .badge-cancelled{
    margin-top:7px;
    display:inline-flex;align-items:center;gap:5px;
    font-size:13.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--accent-text);
    background:color-mix(in srgb, var(--accent) 14%, transparent);
    padding:5px 12px;border-radius:100px;width:fit-content;
  }
  .card.is-cancelled{opacity:.62;}
  .card.is-cancelled .card-img,.card.is-cancelled .card-img.placeholder{filter:grayscale(.5);}

  /* Repère "Nouveau" — événements ajoutés depuis la dernière visite */
  .card-artist{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .badge-new{
    display:inline-flex;align-items:center;
    font-family:var(--font-body);font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;background:var(--teal-deep);
    padding:3px 9px;border-radius:100px;
  }
  .hero-badge-new{
    display:inline-flex;align-items:center;flex:none;
    font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;background:var(--teal-deep);
    padding:4px 11px;border-radius:100px;
  }

  .card{cursor:pointer;transition:transform .12s ease;position:relative;}
  /* mini pastille « placement connu » dans le coin de la carte */
  .place-mini{position:absolute;top:6px;right:7px;width:38px;height:38px;z-index:2;border-radius:50%;
    border:2.5px solid var(--surface);background:#e64330;box-shadow:0 2px 7px rgba(0,0,0,.3);
    animation:placePulse 1.7s ease-out 3;pointer-events:none;}
  .place-mini img{display:block;width:100%;height:100%;border-radius:50%;}
  @keyframes placePulse{0%{box-shadow:0 2px 7px rgba(0,0,0,.3),0 0 0 0 rgba(230,67,48,.6);}100%{box-shadow:0 2px 7px rgba(0,0,0,.3),0 0 0 14px rgba(230,67,48,0);}}
  .card.has-place .card-body{padding-top:28px;}
  @media (prefers-reduced-motion:reduce){.place-mini{animation:none;}}
  .card:active{transform:scale(.985);}
  .hero{cursor:pointer;}
  .card:focus-visible,.hero:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;}

  /* Modal: visuel en entier + réservation */
  .modal-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(15,20,20,.62);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-overlay[hidden]{display:none;}
  @media (min-width:640px){ .modal-overlay{align-items:center;padding:24px;} }
  .modal-panel{
    position:relative;
    background:var(--surface);
    width:100%;max-width:480px;
    max-height:92vh;overflow-y:auto;
    border-radius:24px 24px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.35);
    animation:modal-in .2s ease;
  }
  @media (min-width:640px){ .modal-panel{border-radius:24px;} }
  @keyframes modal-in{ from{transform:translateY(28px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .modal-close{
    position:absolute;top:12px;right:12px;z-index:2;
    width:36px;height:36px;border-radius:50%;
    background:rgba(20,16,10,.55);color:#fff;border:none;
    font-size:25px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  /* Affiche réduite : le contenu (vidéo, date, bouton) reste visible dès
     l'ouverture, sans avoir à défiler. Un toucher sur l'affiche l'agrandit. */
  .modal-poster{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;height:min(38vh,340px);padding:12px;box-sizing:border-box;border:0;
    background:var(--surface-2);border-radius:24px 24px 0 0;overflow:hidden;
    cursor:zoom-in;font-family:var(--font-body);
  }
  .modal-poster-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(24px) saturate(1.15);opacity:.6;}
  #modal-image-wrap .modal-poster img{
    position:relative;width:auto;max-width:100%;height:100%;object-fit:contain;
    border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  }
  .poster-zoom{
    position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(20,16,10,.72);color:#fff;font-weight:700;font-size:14px;
    padding:7px 12px 7px 10px;border-radius:100px;
  }
  .poster-zoom svg{width:16px;height:16px;flex:none;}
  .modal-poster:focus-visible{outline:3px solid var(--accent-2);outline-offset:-3px;}
  .lightbox{
    position:fixed;inset:0;z-index:200;background:rgba(8,10,10,.97);
    display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;cursor:zoom-out;
  }
  .lightbox[hidden]{display:none;}
  .lightbox.is-scene-bg{background:rgba(24,45,104,.99);}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}

  /* Placement des chansigneurs : pastille ronde sous la pastille vidéo */
  .place-badge-btn{margin-bottom:14px;}
  .place-badge-btn .video-badge-img-wrap img{object-fit:contain;}
  .where-info{margin:-2px 0 16px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:2px solid var(--accent-2);
    font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.25;color:var(--ink);}
  .lightbox-stack{width:100%;max-width:720px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:84px;cursor:default;padding:4px 0;}
  .lightbox-stack[hidden]{display:none;}
  .lightbox-stack figure{margin:0;}
  .lightbox-stack figcaption{font-family:var(--font-display);font-weight:800;font-size:24px;color:#fff;margin:0 0 10px;text-transform:uppercase;text-align:center;}
  .lightbox-stack img{display:block;width:100%;height:auto;max-width:none;max-height:none;border-radius:10px;}
  .lb-pending{margin:0;padding:18px 16px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-family:var(--font-display);font-weight:800;font-size:21px;}
  .lightbox img.is-scene{width:100%;max-width:1000px;height:auto;max-height:100%;}
  .lightbox-close{
    position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.18);color:#fff;border:none;font-size:30px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* Lecteur vidéo intégré (Facebook / Instagram) — chargé seulement après un clic */
  .video-overlay{position:fixed;inset:0;z-index:210;background:#182d68;display:flex;align-items:center;justify-content:center;padding:64px 16px 16px;box-sizing:border-box;overflow:auto;}
  .video-overlay[hidden]{display:none;}
  .video-box{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff;}
  .video-name{margin:0;font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.15;}
  .video-frame{display:block;border:0;border-radius:14px;background:#000;height:min(70vh,680px);height:min(70dvh,680px);aspect-ratio:9/16;max-width:100%;}
  .video-consent{background:#fff;color:var(--ink);border-radius:18px;padding:22px 18px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;}

<script>
/* ============================================================
   DONNÉES DES ÉVÉNEMENTS
   ------------------------------------------------------------
   Chaque événement est ajouté ici par Claude, à partir d'un
   visuel (affiche/flyer) envoyé par l'association. Ne PAS
   resynchroniser depuis 10doigtsencavale.com/agenda : cette
   app est alimentée uniquement à la main, événement par
   événement, à partir des visuels transmis en conversation.

   Champs de chaque objet :
   - id        : identifiant unique, ex. "2026-09-11-belin"
   - artist    : nom de l'artiste ou de la tête d'affiche
   - venue     : nom du lieu / festival
   - city      : ville (optionnel, ajouté après une virgule)
   - date      : "AAAA-MM-JJ" (date du concert)
   - time      : "HH:MM" (optionnel)
   - timePrefix : mot affiché devant l'heure (ex. "Dès") ; timeNote : précision (ex. "sous le Grand Chapiteau")
   - timeLabel : libellé libre affiché à la place de l'heure quand elle
                 n'est pas connue (ex. "Soirée") — optionnel
   - link      : URL de réservation, OU "mailto:adresse@mail"
   - linkLabel : texte du bouton (par défaut "Réserver")
   - image     : data URI de l'affiche/visuel, compressée
                 (voir note plus bas), ou null
   - note      : précision courte optionnelle (ex. "Festival",
                 "Complet", "Entrée libre")
   - video     : data URI (ou constante réutilisable) d'une vidéo
                 de présentation en LSF, ou null/absent si aucune.
                 Affiche une vignette "Vidéo en LSF" cliquable en
                 haut du formulaire de l'évènement, qui ouvre la
                 vidéo en plein écran. Plusieurs évènements peuvent
                 pointer vers la même vidéo (déclarée une seule
                 fois en constante) quand elle les concerne tous.

   Pour l'image : redimensionner à ~600px de large et
   compresser en JPEG qualité ~70 avant de convertir en base64,
   pour rester léger. Champ "image" à null si pas de visuel
   dispo : un fond de remplacement s'affiche automatiquement.

   Pour la vidéo : compresser (H.264, ~540px de large suffit,
   CRF ~26) avant de convertir en base64 — une vidéo verticale de
   60-90s tient autour de 5-7 Mo une fois compressée. Attention à
   la taille totale de la page (limite 16 Mo) : réutiliser une
   même constante vidéo pour plusieurs évènements quand c'est le
   cas plutôt que de dupliquer le base64.

   Les événements passés disparaissent seuls de l'affichage
   (comparaison à la date du jour) : inutile de les supprimer.

function parseLocalDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d);
}
function startOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function isMailto(link){
  return typeof link === "string" && (link.startsWith("mailto:") || (link.includes("@") && !link.startsWith("http")));
}
function normalizeLink(link){
  if(!link) return null;
  if(link.startsWith("mailto:") || link.startsWith("http")) return link;
  if(link.includes("@")) return "mailto:" + link;
  return "https://" + link;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* Repère "Nouveau" + pastille sur l'icône de l'appli installée, pour les
   concerts ajoutés depuis la dernière visite. Purement côté navigateur
   (localStorage + Badging API) : ça ne prévient personne activement quand
   l'appli est fermée, seulement au moment où la personne la rouvre — une
   vraie notification poussée demanderait un serveur d'envoi, hors de
   portée d'une page statique. Voir aussi : navigator.setAppBadge (Badging
   API), supportée sur appli installée (Android/Chrome, desktop, iOS 16.4+). */
const SEEN_EVENTS_KEY = "chansigne_seen_event_ids_v1";

function getSeenEventIds(){
  // null = première visite (aucun historique) : on ne veut pas marquer
  // tous les concerts déjà en ligne comme "Nouveau" dans ce cas.
  try {
    const raw = localStorage.getItem(SEEN_EVENTS_KEY);
    return raw ? new Set(JSON.parse(raw)) : null;
  } catch(err){
    return null;
  }
}
function setSeenEventIds(ids){
  try { localStorage.setItem(SEEN_EVENTS_KEY, JSON.stringify(Array.from(ids))); }
  catch(err){ /* stockage indisponible (navigation privée…) : tant pis */ }
}
function updateAppBadge(count){
  try {
    if(count > 0 && "setAppBadge" in navigator) navigator.setAppBadge(count);
    else if("clearAppBadge" in navigator) navigator.clearAppBadge();
  } catch(err){ /* Badging API non dispo (appli non installée, navigateur non compatible…) */ }
}

function namesHtml(g, inline){
  if(!g.multi) return escapeHtml(g.artist);
  return `<span class="names${inline ? " names-inline" : ""}">${g.members.map((m,i) => `<span class="nm">${i ? "+\u00a0" : ""}${escapeHtml(m.artist)}</span>`).join("")}</span>`;
}

// Placement lu en direct dans le tableau (onglet « Placement (public) » publié en CSV).

const PLACEMENT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSLGkhGvXbLbt9JNJN4WoOfmdmxLMcdrFS5sxSACwWtTBOFvVAb9xvmnKiJKQVfg1kR3R2uiyjXAhU/pub?gid=1708998674&single=true&output=csv";
let placementFetchedAt = 0;
function normName(x){ return String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim(); }
function parseCsv(t){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cur); cur=""; rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function isoDate(v){
  v=String(v||"").trim();
  let m;
  if((m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if(/^\d{5}$/.test(v)){ const d=new Date(Date.UTC(1899,11,30)+Number(v)*864e5); return d.toISOString().slice(0,10); }
  return "";
}
function placementCode(v){
  const x=normName(v);
  if(x.startsWith("jardin")) return "jardin";
  if(x.startsWith("cour")) return "cour";
  if(x.startsWith("centre")) return "centre";
  return null;
}
function applyPlacementCsv(text){
  const rows = parseCsv(text).slice(1);
  const found = {};
  for(const r of rows){
    const d=isoDate(r[0]), a=normName(r[1]), p=placementCode(r[2]);
    if(d && a && p) found[d+"|"+a]=p;
  }
  for(const e of EVENTS){
    const p = found[e.date+"|"+normName(e.artist)];
    if(p) PLACEMENT[e.id]=p;
  }
}
function refreshPlacement(force){
  if(!PLACEMENT_CSV_URL) return;
  if(!force && Date.now()-placementFetchedAt < 60000) return;
  placementFetchedAt = Date.now();
  fetch(PLACEMENT_CSV_URL,{cache:"no-store"}).then(r => r.ok ? r.text() : Promise.reject()).then(t => {
    applyPlacementCsv(t);
    updateCardBadges();
    if(currentGroup && !modalEl.hidden) renderWhere(currentGroup);
  }).catch(()=>{});
}
function buildGroups(list){
  const out = [], idx = new Map();
  for(const e of list){
    const link = (!e.soon && !e.cancelled) ? normalizeLink(e.link) : null;
    if(!link){ out.push(Object.assign({}, e, {members:[e]})); continue; }
    const key = [e.date, e.venue, e.city || "", link].join("|");
    if(idx.has(key)){ idx.get(key).members.push(e); continue; }
    const g = Object.assign({}, e, {members:[e]});
    idx.set(key, g); out.push(g);
  }
  for(const g of out){
    const m = g.members;
    g.multi = m.length > 1;
    const seenImg = new Set();
    g.posters = [];
    for(const x of m){
      if(x.image && !seenImg.has(x.image)){ seenImg.add(x.image); g.posters.push({src:x.image, artist:x.artist}); }
    }
    const seenVid = new Set();
    g.videos = [];
    for(const x of m){
      if(x.video && !seenVid.has(x.video)){ seenVid.add(x.video); g.videos.push({url:x.video, artist:x.artist}); }
    }
    if(g.multi){
      g.artist = m.map(x => x.artist).join(" + ");
      g.artistsAnd = m.slice(0,-1).map(x => x.artist).join(", ") + " et " + m[m.length-1].artist;
      g.image = g.posters.length ? g.posters[0].src : null;
      const times = Array.from(new Set(m.map(x => timeText(x)).filter(Boolean)));
      if(times.length === 1 && m.every(x => timeText(x) === times[0])){
        g.time = m[0].time || null; g.timeLabel = m[0].timeLabel || null; g.timePrefix = m[0].timePrefix || null; g.timeNote = m[0].timeNote || null;
      } else {
        g.time = null; g.timePrefix = null; g.timeNote = null; g.timeLabel = times.join(" · ") || null;
      }
    } else {
      g.artistsAnd = g.artist;
    }
  }
  return out;
}

          </div>

    }
    html += `</div></div>`;
  }

  // Laisse le repère "Nouveau" et la pastille sur l'icône visibles un

}

/* Copie dans le presse-papier, avec repli pour les navigateurs qui
   n'ont pas l'API Clipboard (ou la refusent hors contexte sécurisé). */
async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch(err){
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch(err2){
      return false;
    }
  }
}

/* Message pré-rempli, pensé pour les personnes sourdes qui ont du mal
   à rédiger : il suffit de le copier et de l'envoyer tel quel. */
function buildReservationMessage(artist, pshAdults, pshChildren, companionAdults, companionChildren, name, multiDate, vest){
  const pa = Math.max(0, pshAdults);
  const pc = Math.max(0, pshChildren);
  const ca = Math.max(0, companionAdults);
  const cc = Math.max(0, companionChildren);
  const who = name && name.trim() ? `Je m'appelle ${name.trim()}, je` : "Je";

  const pshLines = [];
  if(pa > 0) pshLines.push(`- ${pa} adulte${pa > 1 ? "s" : ""}`);
  if(pc > 0) pshLines.push(`- ${pc} enfant${pc > 1 ? "s" : ""}`);

  const companionLines = [];
  if(ca > 0) companionLines.push(`- ${ca} adulte${ca > 1 ? "s" : ""}`);
  if(cc > 0) companionLines.push(`- ${cc} enfant${cc > 1 ? "s" : ""}`);

  const pshBlock = pshLines.length
    ? `\nPersonnes sourdes/malentendantes :\n${pshLines.join("\n")}\n`
    : "";

  const companionBlock = companionLines.length
    ? `\nPersonnes accompagnantes (sans handicap) :\n${companionLines.join("\n")}\n`
    : "";

  // Gilets vibrants : "oui" ajoute un bloc dédié (+ nombre si renseigné),
  // "non" retire la question, sans réponse on garde la question d'origine.
  const vestWant = vest && vest.want;
  const vestCount = vest && vest.count ? String(vest.count).trim() : "";
  const vestBlock = vestWant === "yes"
    ? `\nGilets vibrants :\n- S'il y a des gilets vibrants, je suis intéressé(e).${vestCount ? `\n- Nombre de gilets vibrants que je souhaite réserver : ${vestCount}` : ""}\n`
    : "";
  const vestQuestion = vestWant === "yes"
    ? "\n- comment réserver les gilets vibrants et où les récupérer."
    : (vestWant === "no" ? "" : "\n- s'il y a des gilets vibrants, où les récupérer.");

  const signature = name && name.trim() ? `Bien cordialement.\n${name.trim()}` : "Bien cordialement.";

  return `Bonjour,

${who} suis sourd(e), je souhaite réserver des places pour ${multiDate ? `la soirée chansignée du ${multiDate}, avec ${artist}` : `le concert chansigné de ${artist}`}.
${pshBlock}${companionBlock}${vestBlock}
Merci de m'indiquer :
- comment acheter mes places.
- Y a-t-il un tarif réduit ?
- où me rendre le jour J, et à quelle heure, pour assister ${multiDate ? "à la soirée chansignée" : "au concert chansigné"}.${vestQuestion}

Pour faciliter ma compréhension, merci de privilégier une réponse claire et avec des phrases simples.

En vous remerciant.
${signature}`;
}

/* Rappel calendrier — sans serveur, sans fichier téléchargé (les pages
   publiées ici ne peuvent pas proposer de téléchargement de fichier aux
   visiteurs : le navigateur bloque tout data:/blob: déclenché par la page).
   Solution fiable : un lien "Ajouter à Google Agenda" prérempli, qui
   fonctionne comme un lien de réservation classique. Les horaires sont
   convertis en UTC en tenant compte de l'heure d'été/hiver française. */
// Horaire affiché : heure précise (time) ou libellé libre (timeLabel, ex. "Soirée")
function timeText(e){
  if(e.time) return (e.timePrefix ? e.timePrefix + " " : "") + e.time.replace(":", "h");
  return e.timeLabel || "";
}
function noteText(e){ return e.timeNote ? e.timeNote.charAt(0).toUpperCase() + e.timeNote.slice(1) : ""; }
function pad2(n){ return String(n).padStart(2,"0"); }
function parisUtcOffsetHours(y, m, d){
  // Règle européenne : heure d'été du dernier dimanche de mars (UTC+2)
  // au dernier dimanche d'octobre (retour à UTC+1).
  function lastSundayUTC(year, monthIndex){
    const last = new Date(Date.UTC(year, monthIndex + 1, 0));
    last.setUTCDate(last.getUTCDate() - last.getUTCDay());
    return last.getTime();
  }
  const check = Date.UTC(y, m, d);
  const dstStart = lastSundayUTC(y, 2);  // mars
  const dstEnd = lastSundayUTC(y, 9);    // octobre
  return (check >= dstStart && check < dstEnd) ? 2 : 1;
}
function buildGoogleCalendarUrl(e){
  const dt = parseLocalDate(e.date);
  const y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
  const text = `${e.artist} — ${e.multi ? "concerts chansignés" : "concert chansigné"}`;
  const details = "Concert traduit en langue des signes par 10 Doigts en Cavale.";
  const location = [e.venue, e.city].filter(Boolean).join(", ");

  let datesParam;
  if(e.time){
    const [h, min] = e.time.split(":").map(Number);
    const offset = parisUtcOffsetHours(y, m, d);
    const startMs = Date.UTC(y, m, d, h, min) - offset * 3600000;
    const endMs = startMs + 2 * 3600000; // durée par défaut : 2h
    const fmt = ms => {
      const u = new Date(ms);
      return `${u.getUTCFullYear()}${pad2(u.getUTCMonth()+1)}${pad2(u.getUTCDate())}T${pad2(u.getUTCHours())}${pad2(u.getUTCMinutes())}00Z`;
    };
    datesParam = `${fmt(startMs)}/${fmt(endMs)}`;
  } else {
    const end = new Date(y, m, d + 1);
    const fmtDate = dd => `${dd.getFullYear()}${pad2(dd.getMonth()+1)}${pad2(dd.getDate())}`;
    datesParam = `${fmtDate(dt)}/${fmtDate(end)}`;
  }

  const params = new URLSearchParams({ action: "TEMPLATE", text, dates: datesParam, details, location });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

            </div>
            <pre class="message-preview" id="message-preview"></pre>
            <button type="button" class="modal-cta" id="copy-all-btn">${iconCopy} Copier le message et le mail pour l'envoyer</button>
          </div>

          <div class="msg-step">
            <div class="msg-step-head">
              <span class="msg-step-icon">${iconMail}</span>
              <span class="msg-step-label">3. Envoyez-le depuis votre boîte mail</span>
            </div>
            <p class="msg-step-hint">Ouvrez votre application mail, collez le message, et envoyez-le à :</p>
            <p class="msg-address-chip">${escapeHtml(mailAddress)}</p>
          </div>
        </div>`;
    } else {
      modalMessageWrap.innerHTML = `
        <div class="modal-message">
          <div class="help-banner" role="note">
            <span class="help-banner-icon">${iconMail}</span>
            <div>
              <p class="help-banner-title">Vous souhaitez écrire au festival / la salle pour effectuer une demande de réservation ?</p>
              <p class="help-banner-text">Remplissez le formulaire</p>
              <p class="help-banner-warn">Le message se rédige à votre place</p>
              <p class="help-banner-warn">Copiez et envoyez le message vous-même à l'organisateur.</p>
            </div>
          </div>

          <label class="field-label" for="msg-name">Votre nom et prénom</label>
          <input type="text" id="msg-name" class="field-input" placeholder="Ex. : Camille Dupont" autocomplete="name">
          ${stepperGroupsHtml}

          <pre class="message-preview" id="message-preview"></pre>
          <button type="button" class="modal-copy-message" id="copy-message-btn">Copier le message</button>
        </div>`;
    }

    const counts = { pshAdults: 0, pshChildren: 0, compAdults: 0, compChildren: 0 };
    const vest = { want: null, count: "" };
    const nameInput = document.getElementById("msg-name");
    const preview = document.getElementById("message-preview");
    const copyMsgBtn = mailAddress ? null : document.getElementById("copy-message-btn");
    const baseMsgLabel = copyMsgBtn ? copyMsgBtn.textContent : "";
    const copyAllBtn = mailAddress ? document.getElementById("copy-all-btn") : null;
    const baseCopyAllLabel = copyAllBtn ? copyAllBtn.innerHTML : "";

    function refreshMessage(){
      document.getElementById("psh-adults-count").textContent = String(counts.pshAdults);
      document.getElementById("psh-children-count").textContent = String(counts.pshChildren);
      document.getElementById("comp-adults-count").textContent = String(counts.compAdults);
      document.getElementById("comp-children-count").textContent = String(counts.compChildren);
      preview.textContent = buildReservationMessage(
        e.artistsAnd, counts.pshAdults, counts.pshChildren, counts.compAdults, counts.compChildren, nameInput.value,
        e.multi ? `${dt.getDate()} ${MOIS[dt.getMonth()].toLowerCase()}` : null,
        vest
      );
    }
    refreshMessage();

    function wireStepper(key, idPrefix, min){
      document.getElementById(`${idPrefix}-minus`).addEventListener("click", () => {
        counts[key] = Math.max(min, counts[key] - 1);
        refreshMessage();
      });
      document.getElementById(`${idPrefix}-plus`).addEventListener("click", () => {
        counts[key] = Math.min(20, counts[key] + 1);
        refreshMessage();
      });
    }
    wireStepper("pshAdults", "psh-adults", 0);
    wireStepper("pshChildren", "psh-children", 0);
    wireStepper("compAdults", "comp-adults", 0);
    wireStepper("compChildren", "comp-children", 0);

    nameInput.addEventListener("input", refreshMessage);
    const vestWrap = document.getElementById("vest-count-wrap");
    const vestCountInput = document.getElementById("vest-count");
    document.querySelectorAll('input[name="vest-want"]').forEach(r => r.addEventListener("change", () => {
      vest.want = r.value;
      vestWrap.hidden = r.value !== "yes";
      refreshMessage();
    }));
    vestCountInput.addEventListener("input", () => { vest.count = vestCountInput.value; refreshMessage(); });
    if(copyMsgBtn){
      copyMsgBtn.addEventListener("click", async () => {
        const ok = await copyText(preview.textContent);
        copyMsgBtn.textContent = ok ? "Message copié ✓" : "Impossible de copier le message";
        copyMsgBtn.classList.toggle("is-copied", ok);
        setTimeout(() => { copyMsgBtn.textContent = baseMsgLabel; copyMsgBtn.classList.remove("is-copied"); }, 2500);
      });
    }
    if(copyAllBtn){
      // Un seul geste copie tout ce qu'il faut (adresse + message) pour que
      // la personne n'ait plus qu'à coller dans sa propre appli mail.
      copyAllBtn.addEventListener("click", async () => {
        const combined = `À : ${mailAddress}\nObjet : Réservation — ${e.multi ? "soirée chansignée" : "concert chansigné"} de ${e.artistsAnd}\n\n${preview.textContent}`;
        const ok = await copyText(combined);
        copyAllBtn.innerHTML = ok ? "Copié ✓ — collez-le dans un nouveau mail" : "Impossible de copier";
        copyAllBtn.classList.toggle("is-copied", ok);
        setTimeout(() => { copyAllBtn.innerHTML = baseCopyAllLabel; copyAllBtn.classList.remove("is-copied"); }, 3000);
      });
    }
  }

  lastFocused = document.activeElement;
  modalEl.hidden = false;
  document.body.classList.add("modal-open");
  document.getElementById("modal-close-btn").focus();
}

const lightboxEl = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxStack = document.getElementById("lightbox-stack");
function openLightboxStack(items){
  lightboxImg.hidden = true; lightboxImg.removeAttribute("src");
  lightboxStack.innerHTML = items.map(it => `<figure><figcaption>${escapeHtml(it.artist)}</figcaption>${
    it.pos ? `<img src="${sceneSrc(it.pos)}" alt="${escapeHtml(it.artist)} : ${SCENE_INFO[it.pos].alt.replace("Illustration : ","")}">`
           : `<p class="lb-pending">À consulter le jour du concert</p>`}</figure>`).join("");
  lightboxStack.hidden = false; lightboxStack.scrollTop = 0;
  lightboxEl.classList.add("is-scene-bg");
  lightboxEl.hidden = false;
  document.getElementById("lightbox-close").focus();
}
function openLightbox(src, alt, scene){
  lightboxStack.hidden = true; lightboxStack.innerHTML = ""; lightboxImg.hidden = false;
  lightboxImg.classList.toggle("is-scene", !!scene);
  lightboxImg.alt = alt || "";
  lightboxImg.src = src;
  lightboxEl.classList.toggle("is-scene-bg", !!scene);
  lightboxEl.hidden = false;
  document.getElementById("lightbox-close").focus();
}
function closeLightbox(){
  lightboxEl.hidden = true;
  lightboxEl.classList.remove("is-scene-bg");
  lightboxImg.removeAttribute("src");
  lightboxImg.classList.remove("is-scene");
  lightboxStack.hidden = true; lightboxStack.innerHTML = ""; lightboxImg.hidden = false;
  lightboxImg.alt = "";
  const pb = lastPosterBtn && lastPosterBtn.isConnected ? lastPosterBtn : document.querySelector("#modal-image-wrap .modal-poster");
  if(pb) pb.focus();
}
lightboxEl.addEventListener("click", closeLightbox);

// ---- Lecteur vidéo intégré -------------------------------------------------
// Les vidéos LSF sont publiées sur Facebook (ou Instagram). On les affiche dans
// l'appli pour que la personne reste dans l'agenda : la croix ou « Revenir à
// l'agenda » referme le lecteur. Rien n'est chargé chez Facebook/Instagram
// avant le clic sur « Lancer la vidéo » (information : page confidentialité). Si le
// lien n'est pas reconnu, on garde le comportement d'avant (nouvel onglet).
const videoOverlay = document.getElementById("video-overlay");
const videoBox = document.getElementById("video-box");
let videoConsent = false, lastVideoBtn = null;
function videoEmbedInfo(url){
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^(www|m|web)\./, "");
    if(host === "facebook.com" || host === "fb.watch")
      return { net:"Facebook", src:"https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(url) + "&show_text=false&autoplay=true" };
    const m = host === "instagram.com" && u.pathname.match(/^\/(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/);
    if(m) return { net:"Instagram", src:"https://www.instagram.com/" + (m[1] === "reels" ? "reel" : m[1]) + "/" + m[2] + "/embed" };
  }catch(_){}
  return null;
}
function renderVideo(info, url, artist){
  const name = artist ? `<p class="video-name">${escapeHtml(artist)}</p>` : "";
  const ext = `<a class="video-ext" href="${escapeHtml(url)}" target="_blank" rel="noopener">Ouvrir sur ${info.net}</a>`;
  if(!videoConsent){
    videoBox.innerHTML = `${name}
      <button type="button" class="video-btn is-main" id="video-go">${iconPlay} Lancer la vidéo</button>`;
    document.getElementById("video-go").addEventListener("click", () => { videoConsent = true; renderVideo(info, url, artist); });
    document.getElementById("video-go").focus();
    return;
  }
  videoBox.innerHTML = `${name}
    <iframe class="video-frame" title="Vidéo en langue des signes" src="${info.src}"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share; fullscreen" allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
      sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation"></iframe>
    <button type="button" class="video-btn is-back" id="video-back">← Revenir à l'agenda</button>
    ${ext}`;
  document.getElementById("video-back").addEventListener("click", closeVideo);
  document.getElementById("video-back").focus();
}
function openVideo(btn){
  const url = btn.dataset.videoUrl, info = videoEmbedInfo(url);
  if(!info) return false;
  lastVideoBtn = btn;
  const multi = document.querySelectorAll("#modal-video-wrap .video-badge-btn").length > 1;
  renderVideo(info, url, multi ? btn.dataset.videoArtist : "");
  videoOverlay.hidden = false;
  document.getElementById("video-close").focus();
  return true;
}
function closeVideo(){
  videoOverlay.hidden = true;
  videoBox.innerHTML = "";            // retire l'iframe : la vidéo s'arrête
  if(lastVideoBtn && lastVideoBtn.isConnected) lastVideoBtn.focus();
}
document.getElementById("video-close").addEventListener("click", closeVideo);
videoOverlay.addEventListener("click", ev => { if(ev.target === videoOverlay) closeVideo(); });
modalVideoWrap.addEventListener("click", ev => {
  const a = ev.target.closest("a.video-badge-btn[data-video-url]");
  if(!a || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  if(openVideo(a)) ev.preventDefault();
});

function closeModal(){
  modalEl.hidden = true;
  document.body.classList.remove("modal-open");
  if(lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
}

function wireCardTriggers(container){
  container.addEventListener("click", ev => {
    const card = ev.target.closest("[data-id]");
    if(card) openModal(card.dataset.id);
  });
  container.addEventListener("keydown", ev => {
    if(ev.key !== "Enter" && ev.key !== " ") return;
    const card = ev.target.closest("[data-id]");
    if(!card) return;
    ev.preventDefault();
    openModal(card.dataset.id);
  });
}
wireCardTriggers(document.getElementById("hero-slot"));
wireCardTriggers(document.getElementById("list-slot"));

document.getElementById("modal-close-btn").addEventListener("click", closeModal);
modalEl.addEventListener("click", ev => { if(ev.target === modalEl) closeModal(); });

document.addEventListener("keydown", ev => {
  if(ev.key !== "Escape") return;
  if(!videoOverlay.hidden){ closeVideo(); return; }
  if(!lightboxEl.hidden){ closeLightbox(); return; }
  if(!modalEl.hidden) closeModal();
});

/* Installation sur l'écran d'accueil (PWA). Un lien web ne peut pas "télécharger"
   une appli à lui seul : sur Android le navigateur propose l'installation
   (bouton natif si disponible), sur iPhone il faut passer par Partager →
   "Sur l'écran d'accueil". Le bouton affiche donc la bonne marche à suivre. */
(function(){
  try {
    const wrap = document.getElementById("install-wrap");
    const btn = document.getElementById("install-btn");
    const help = document.getElementById("install-help");
    if(!wrap || !btn || !help) return;
    const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    if(standalone) return;
    const again = document.getElementById("install-again");
    const dismissBtn = document.getElementById("install-dismiss");
    const KEY = "agenda-install-dismissed";
    const getDismissed = () => { try { return localStorage.getItem(KEY) === "1"; } catch(e) { return false; } };
    const setDismissed = v => { try { if(v) localStorage.setItem(KEY, "1"); else localStorage.removeItem(KEY); } catch(e) {} };
    const render = dismissed => {
      wrap.hidden = dismissed;
      if(again) again.hidden = !dismissed;
      if(dismissed) help.hidden = true;
    };
    render(getDismissed());
    if(dismissBtn) dismissBtn.addEventListener("click", () => { setDismissed(true); render(true); });
    if(again) again.addEventListener("click", ev => { ev.preventDefault(); setDismissed(false); render(false); window.scrollTo({top:0,behavior:"smooth"}); });
    // L'évènement du navigateur est capturé très tôt (dans <head>) pour ne pas
    // le rater : sans lui, Chrome ne propose pas l'installation en un geste.
    let deferred = window.__bip || null;
    window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); deferred = ev; });
    window.addEventListener("appinstalled", () => { deferred = null; setDismissed(true); render(true); if(again) again.hidden = true; });
    if(window.__installed){ wrap.hidden = true; if(again) again.hidden = true; return; }
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    const stepsIOS = '<p><strong>Sur iPhone / iPad (Safari) :</strong></p><p>1. Touchez le bouton <strong>Partager</strong> (le carré avec une flèche vers le haut).</p><p>2. Choisissez <strong>« Sur l\'écran d\'accueil »</strong>.</p><p>3. Touchez <strong>Ajouter</strong>.</p>';
    const stepsAndroid = '<p><strong>Sur Android (Chrome) :</strong></p><p>1. Touchez le menu <strong>⋮</strong> en haut à droite.</p><p>2. Choisissez <strong>« Installer l\'application »</strong> (ou « Ajouter à l\'écran d\'accueil »).</p><p>3. Confirmez.</p><p>L\'appli est peut-être <strong>déjà installée</strong> : cherchez l\'icône « Agenda Chansigné » sur votre écran d\'accueil.</p>';
    // Samsung Internet : son installateur d'applis web produit un paquet jugé
    // "non sécurisé" par Google Play Protect (Android 14+), ce qui bloque
    // l'installation. Chrome n'a pas ce problème : on y renvoie la personne.
    const isSamsung = /SamsungBrowser/i.test(ua) && isAndroid;
    const chromeIntent = "intent://" + location.host + location.pathname + location.search +
      "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end";
    const stepsSamsung = '<p><strong>Vous utilisez Samsung Internet.</strong> Ce navigateur ne sait pas installer cette appli (message « Impossible d\'installer l\'application web »).</p><p><strong>Option 1 (recommandée) :</strong> touchez <strong>« Installer avec Chrome »</strong> : la page s\'ouvre dans Google Chrome, où l\'installation fonctionne.</p><p><strong>Option 2 :</strong> dans Samsung Internet, touchez le menu <strong>☰</strong> (en bas à droite), puis <strong>« Ajouter la page à »</strong> et <strong>« Écran d\'accueil »</strong>. Vous obtenez une icône qui ouvre l\'agenda.</p>';
    if(isSamsung){
      const label = document.getElementById("install-label");
      if(label) label.textContent = "Installer avec Chrome";
      btn.dataset.chromeIntent = chromeIntent;
      help.innerHTML = stepsSamsung;
      help.hidden = false;
    }
    // Navigateur intégré à une appli (Facebook, Instagram, Messenger, TikTok…) :
    // l'installation y est impossible, il faut d'abord rouvrir la page dans le
    // vrai navigateur. C'est le cas le plus fréquent pour qui arrive depuis un
    // post ou une story.
    const inApp = !isSamsung && (/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|TikTok|musical_ly|BytedanceWebview|Snapchat|LinkedInApp|MicroMessenger|Line\//i.test(ua) || (isAndroid && /; wv\)/.test(ua)));
    const stepsInApp = '<p><strong>Cette page est ouverte dans une autre appli</strong> (Facebook, Instagram…) : l\'installation n\'y est pas possible.</p>' +
      (isIOS
        ? '<p>1. Touchez <strong>⋯</strong> (en bas ou en haut à droite).</p><p>2. Choisissez <strong>« Ouvrir dans Safari »</strong>.</p><p>3. Touchez ensuite <strong>« Installer l\'appli sur mon téléphone »</strong>.</p>'
        : '<p>1. Touchez <strong>« Ouvrir dans Chrome »</strong> ci-dessus. Si rien ne se passe : touchez <strong>⋮</strong> (ou ⋯) en haut à droite, puis <strong>« Ouvrir dans le navigateur »</strong>.</p><p>2. Touchez ensuite <strong>« Installer l\'appli sur mon téléphone »</strong>.</p>') +
      '<p><button type="button" class="install-copy" id="install-copy">Copier le lien de l\'agenda</button> <span id="install-copy-state" role="status"></span></p>';
    if(inApp){
      const label = document.getElementById("install-label");
      if(label) label.textContent = isIOS ? "Ouvrir dans Safari" : "Ouvrir dans Chrome";
      help.innerHTML = stepsInApp;
      help.hidden = false;
      help.addEventListener("click", async ev => {
        const c = ev.target.closest("#install-copy"); if(!c) return;
        const s = document.getElementById("install-copy-state");
        try { await navigator.clipboard.writeText(location.origin + location.pathname); s.textContent = "Lien copié."; }
        catch(e){ s.textContent = location.origin + location.pathname; }
      });
    }
    btn.addEventListener("click", async () => {
      if(isSamsung){ window.location.href = chromeIntent; return; }
      if(inApp){ if(isAndroid) window.location.href = chromeIntent; else help.hidden = false; return; }
      if(deferred){
        try { deferred.prompt(); await deferred.userChoice; } catch(e) {}
        deferred = null;
        return;
      }
      help.innerHTML = isIOS ? stepsIOS : (isAndroid ? stepsAndroid : stepsAndroid + stepsIOS);
      help.hidden = !help.hidden;
    });
  } catch(err) { /* l'aide à l'installation n'est pas essentielle */ }
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
