<style>
  :root{
    --bg:#d9f0f2;
    --surface:#ffffff;
    --surface-2:#c3e6e9;
    --ink:#3b2013;
    --muted:#6e5a47;
    --line:#b3dade;
    --accent:#d33d27;
    --accent-text:#b3321f;
    --accent-ink:#ffffff;
    --accent-2:#f0a028;
    --accent-2-ink:#3b2013;
    --teal:#8fc7bc;
    --teal-deep:#2f7468;
    --row:#fbfdfd;
    --shadow: 0 1px 2px rgba(59,32,19,.08), 0 8px 24px -12px rgba(59,32,19,.24);
    --font-display:'Avenir Next Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue Condensed',system-ui,sans-serif;
    --font-body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a2226;
      --surface:#123033;
      --surface-2:#163a3d;
      --ink:#f2fbfb;
      --muted:#b4d6d9;
      --line:#1f4a4e;
      --accent:#2fc4bd;
      --accent-text:#7fe3dd;
      --accent-ink:#04292c;
      --accent-2:#8fd8f3;
      --accent-2-ink:#06283a;
      --teal:#8fe0d6;
      --teal-deep:#74dccf;
      --row:#1a4347;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a2226;
    --surface:#123033;
    --surface-2:#163a3d;
    --ink:#f2fbfb;
    --muted:#b4d6d9;
    --line:#1f4a4e;
    --accent:#2fc4bd;
      --accent-text:#7fe3dd;
    --accent-ink:#04292c;
    --accent-2:#8fd8f3;
    --accent-2-ink:#06283a;
    --teal:#8fe0d6;
    --teal-deep:#74dccf;
    --row:#1a4347;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  a{color:inherit;}
  img{display:block;}

  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px 14px;
    max-width:640px;margin:0 auto;
  }
  .mark{
    width:46px;height:46px;border-radius:13px;flex:none;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(224,67,44,.35);
  }
  .mark img{width:100%;height:100%;object-fit:cover;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:21px;
    letter-spacing:.2px;
    margin:0;
    line-height:1.1;
  }
  .brand p{
    margin:1px 0 0;
    font-size:14.5px;
    color:var(--muted);
    letter-spacing:.2px;
  }

  main{max-width:640px;margin:0 auto;padding:0 16px;}

  /* Hero: next concert */
  .hero{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:var(--accent);
    color:#fff;
    margin:6px 0 28px;
    box-shadow:var(--shadow);
    min-height:220px;
  }
  .hero-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center top;
    filter:saturate(1.05);
  }
  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(59,20,10,.12) 0%, rgba(43,13,4,.55) 38%, rgba(43,13,4,.86) 62%, rgba(43,13,4,.95) 100%);
  }
  .hero-noimg{
    position:absolute;inset:0;
    background:
      radial-gradient(130% 150% at 12% -10%, var(--accent-2) 0%, transparent 55%),
      linear-gradient(155deg,var(--accent),#a82a1a 75%);
  }
  .hero-confetti{
    position:absolute;top:16px;left:16px;display:flex;gap:6px;align-items:center;
    opacity:.85;pointer-events:none;
  }
  .hero-confetti span{display:block;width:6px;height:6px;border-radius:50%;background:#fff;}
  .hero-confetti span:nth-child(2){background:var(--accent-2);width:8px;height:8px;}
  .hero-confetti span:nth-child(3){background:var(--teal);width:5px;height:5px;}
  .hero-doodle{
    position:absolute;top:14px;right:14px;width:60px;height:auto;
    opacity:.5;pointer-events:none;
  }
  .hero-inner{
    position:relative;padding:20px 20px 20px;
    display:flex;flex-direction:column;min-height:220px;
  }
  .hero-eyebrow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .hero-eyebrow{
    font-size:13.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:#ffe6c2;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(43,13,4,.82);padding:5px 11px;border-radius:999px;
  }
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 4px rgba(240,160,40,.35);}
  .hero-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(31px,8vw,41px);
    line-height:1;
    margin:10px 0 6px;
    text-wrap:balance;
  }
  .hero-meta{
    font-size:16.5px;
    color:#fff0e2;
    display:flex;flex-wrap:wrap;gap:x;
    row-gap:4px;
  }
  .hero-meta span:not(:last-child)::after{content:"·";margin:0 7px;color:#f0b39e;}
  .hero-actions{margin-top:auto;padding-top:16px;display:flex;gap:10px;flex-wrap:wrap;}

  .btn{
    appearance:none;border:none;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--font-body);font-weight:700;font-size:16.5px;
    padding:11px 18px;border-radius:100px;cursor:pointer;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent-2);color:var(--accent-2-ink);}
  .btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);}

  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
    padding-top:2px;
  }

  .month{margin-bottom:26px;}
  .month-head{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    padding:10px 0 8px;
    display:flex;align-items:baseline;gap:10px;
  }
  .month-head h2{
    font-family:var(--font-display);
    font-weight:800;
    font-size:27px;
    margin:0;
    letter-spacing:.2px;
    color:var(--accent-text);
  }
  .month-head .count{
    font-size:14.5px;color:var(--muted);font-weight:600;
  }

  .cards{display:flex;flex-direction:column;gap:10px;}

  .card{
    display:flex;gap:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  .card-date{
    flex:none;width:52px;text-align:center;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
  }
  .card-date .d{
    font-family:var(--font-display);
    font-weight:800;font-size:29px;line-height:1;
    color:var(--accent-text);
    font-variant-numeric:tabular-nums;
  }
  .card-date .y{font-size:12px;font-weight:600;color:var(--muted);line-height:1.1;margin-top:3px;}
  .card-date .m{
    margin-top:4px;font-size:12.5px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);
  }
  .card-img{
    flex:none;width:76px;height:76px;border-radius:12px;
    background:var(--surface-2);object-fit:cover;
    border:1px solid var(--line);
  }
  /* Affiche entière (format 9:16) : elle occupe toute la hauteur de la carte,
     jusqu'au bouton Réserver, sans être coupée en carré. */
  img.card-img{align-self:stretch;height:auto;min-height:135px;object-position:center top;}
  .card-img.placeholder{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:25px;
    color:var(--muted);
  }
  .card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center;}
  .card-artist{
    font-family:var(--font-display);
    font-weight:700;font-size:20px;line-height:1.15;
    overflow-wrap:anywhere;
  }
  .card-venue{
    font-size:15.5px;color:var(--muted);line-height:1.3;
    overflow-wrap:anywhere;
    display:flex;align-items:flex-start;gap:4px;
  }
  .card-venue-name{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.25;overflow-wrap:anywhere;}
  .card-date .t{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.2;margin-top:16px;text-align:center;overflow-wrap:anywhere;}
  .card-note{font-size:14.5px;color:var(--muted);line-height:1.3;font-style:italic;}
  .hero-meta-stack .hero-hour{font-weight:700;}
  .card-time{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3;display:flex;align-items:center;gap:4px;}
  .card-time .clock{width:12px;height:12px;flex:none;color:var(--accent-2);}
  .hero-meta-stack{flex-direction:column;align-items:flex-start;row-gap:2px;}
  .hero-meta-stack span:not(:last-child)::after{content:none;}
  .hero-meta-stack span:first-child{font-weight:700;}
  .card-venue .pin{margin-top:3px;}
  .card-venue .pin{width:11px;height:11px;flex:none;color:var(--accent-2);}
  .card-cta{
    appearance:none;border:none;font-family:var(--font-body);cursor:pointer;
    margin-top:7px;
    display:inline-flex;align-items:center;gap:5px;
    font-size:14.5px;font-weight:700;color:var(--accent-2-ink);
    background:var(--accent-2);
    padding:5px 12px 5px 10px;border-radius:100px;
    text-decoration:none;width:fit-content;
  }
  .card-cta svg{width:12px;height:12px;flex:none;}
  .badge-cancelled{
    margin-top:7px;
    display:inline-flex;align-items:center;gap:5px;
    font-size:13.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--accent-text);
    background:color-mix(in srgb, var(--accent) 14%, transparent);
    padding:5px 12px;border-radius:100px;width:fit-content;
  }
  .card.is-cancelled{opacity:.62;}
  .card.is-cancelled .card-img,.card.is-cancelled .card-img.placeholder{filter:grayscale(.5);}

  /* Repère "Nouveau" — événements ajoutés depuis la dernière visite */
  .card-artist{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .badge-new{
    display:inline-flex;align-items:center;
    font-family:var(--font-body);font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;background:var(--teal-deep);
    padding:3px 9px;border-radius:100px;
  }
  .hero-badge-new{
    display:inline-flex;align-items:center;flex:none;
    font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;background:var(--teal-deep);
    padding:4px 11px;border-radius:100px;
  }

  .card{cursor:pointer;transition:transform .12s ease;position:relative;}
  /* mini pastille « placement connu » dans le coin de la carte */
  .place-mini{position:absolute;top:6px;right:7px;width:38px;height:38px;z-index:2;border-radius:50%;
    border:2.5px solid var(--surface);background:#e64330;box-shadow:0 2px 7px rgba(0,0,0,.3);
    animation:placePulse 1.7s ease-out 3;pointer-events:none;}
  .place-mini img{display:block;width:100%;height:100%;border-radius:50%;}
  @keyframes placePulse{0%{box-shadow:0 2px 7px rgba(0,0,0,.3),0 0 0 0 rgba(230,67,48,.6);}100%{box-shadow:0 2px 7px rgba(0,0,0,.3),0 0 0 14px rgba(230,67,48,0);}}
  .card.has-place .card-body{padding-top:28px;}
  @media (prefers-reduced-motion:reduce){.place-mini{animation:none;}}
  .card:active{transform:scale(.985);}
  .hero{cursor:pointer;}
  .card:focus-visible,.hero:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;}

  /* Modal: visuel en entier + réservation */
  .modal-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(15,20,20,.62);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-overlay[hidden]{display:none;}
  @media (min-width:640px){ .modal-overlay{align-items:center;padding:24px;} }
  .modal-panel{
    position:relative;
    background:var(--surface);
    width:100%;max-width:480px;
    max-height:92vh;overflow-y:auto;
    border-radius:24px 24px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.35);
    animation:modal-in .2s ease;
  }
  @media (min-width:640px){ .modal-panel{border-radius:24px;} }
  @keyframes modal-in{ from{transform:translateY(28px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .modal-close{
    position:absolute;top:12px;right:12px;z-index:2;
    width:36px;height:36px;border-radius:50%;
    background:rgba(20,16,10,.55);color:#fff;border:none;
    font-size:25px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  /* Affiche réduite : le contenu (vidéo, date, bouton) reste visible dès
     l'ouverture, sans avoir à défiler. Un toucher sur l'affiche l'agrandit. */
  .modal-poster{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;height:min(38vh,340px);padding:12px;box-sizing:border-box;border:0;
    background:var(--surface-2);border-radius:24px 24px 0 0;overflow:hidden;
    cursor:zoom-in;font-family:var(--font-body);
  }
  .modal-poster-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(24px) saturate(1.15);opacity:.6;}
  #modal-image-wrap .modal-poster img{
    position:relative;width:auto;max-width:100%;height:100%;object-fit:contain;
    border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  }
  .poster-zoom{
    position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(20,16,10,.72);color:#fff;font-weight:700;font-size:14px;
    padding:7px 12px 7px 10px;border-radius:100px;
  }
  .poster-zoom svg{width:16px;height:16px;flex:none;}
  .modal-poster:focus-visible{outline:3px solid var(--accent-2);outline-offset:-3px;}
  .lightbox{
    position:fixed;inset:0;z-index:200;background:rgba(8,10,10,.97);
    display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;cursor:zoom-out;
  }
  .lightbox[hidden]{display:none;}
  .lightbox.is-scene-bg{background:rgba(24,45,104,.99);}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}

  /* Placement des chansigneurs : pastille ronde sous la pastille vidéo */
  .place-badge-btn{margin-bottom:14px;}
  .place-badge-btn .video-badge-img-wrap img{object-fit:contain;}
  .where-info{margin:-2px 0 16px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:2px solid var(--accent-2);
    font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.25;color:var(--ink);}
  .lightbox-stack{width:100%;max-width:720px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:84px;cursor:default;padding:4px 0;}
  .lightbox-stack[hidden]{display:none;}
  .lightbox-stack figure{margin:0;}
  .lightbox-stack figcaption{font-family:var(--font-display);font-weight:800;font-size:24px;color:#fff;margin:0 0 10px;text-transform:uppercase;text-align:center;}
  .lightbox-stack img{display:block;width:100%;height:auto;max-width:none;max-height:none;border-radius:10px;}
  .lb-pending{margin:0;padding:18px 16px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-family:var(--font-display);font-weight:800;font-size:21px;}
  .lightbox img.is-scene{width:100%;max-width:1000px;height:auto;max-height:100%;}
  .lightbox-close{
    position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.18);color:#fff;border:none;font-size:30px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* Lecteur vidéo intégré (Facebook / Instagram) — chargé seulement après un clic */
  .video-overlay{position:fixed;inset:0;z-index:210;background:#182d68;display:flex;align-items:center;justify-content:center;padding:64px 16px 16px;box-sizing:border-box;overflow:auto;}
  .video-overlay[hidden]{display:none;}
  .video-box{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff;}
  .video-name{margin:0;font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.15;}
  .video-frame{display:block;border:0;border-radius:14px;background:#000;height:min(70vh,680px);height:min(70dvh,680px);aspect-ratio:9/16;max-width:100%;}
  .video-consent{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px 18px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .video-consent p{margin:0;font-size:16px;line-height:1.4;font-weight:600;}
  .video-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;min-height:56px;padding:12px 18px;border-radius:999px;border:0;cursor:pointer;
    font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.2;text-decoration:none;}
  .video-btn.is-main{background:var(--accent);color:var(--accent-ink,#fff);}
  .video-btn.is-back{background:var(--surface);color:var(--ink);}
  .video-btn svg{width:20px;height:20px;flex:none;}
  .video-ext{color:#fff;font-weight:700;font-size:15.5px;text-decoration:underline;text-underline-offset:3px;}
  .video-consent .video-ext{color:var(--ink);}
  .modal-body{padding:18px 22px 28px;}

  /* Vignette "Vidéo en LSF" — en haut du formulaire, avant tout le reste */
  .video-badge-btn{
    appearance:none;border:none;background:none;padding:0;margin-bottom:18px;cursor:pointer;
    text-decoration:none;
    display:inline-flex;align-items:center;gap:16px;
  }
  .video-badge-img-wrap{position:relative;width:88px;height:88px;flex:none;}
  .video-badge-img-wrap img{width:100%;height:100%;display:block;}
  /* pastille vidéo un peu plus grande que celle du placement (le disque rouge, plein, paraît plus gros) */
  .video-badge-btn:not(.place-badge-btn) .video-badge-img-wrap img{transform:scale(1.17);}
  .video-badge-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.45);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .video-badge-play svg{width:9px;height:9px;margin-left:1px;}
  .video-badge-btn:active .video-badge-img-wrap{transform:scale(.94);}
  .video-badge-label{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink);text-align:left;line-height:1.3;}
  .video-badge-label small{display:block;font-family:var(--font-body);font-size:15.5px;font-weight:600;color:var(--muted);}


  /* Soirée à plusieurs artistes : une seule carte, une seule réservation */
  .card-img.card-duo{display:flex;flex-direction:column;gap:6px;height:auto;overflow:visible;padding:0;background:none;border:0;}
  .card-duo .duo-cell{position:relative;width:76px;height:135px;flex:none;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);}
  .card-duo img{display:block;width:100%;height:100%;object-fit:cover;}
  .card-duo .duo-more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(20,16,10,.62);color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;}
  .card-multi-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px;}
  .badge-duo{
    display:inline-flex;align-items:center;
    font-family:var(--font-body);font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
    padding:2px 8px;border-radius:100px;white-space:nowrap;
  }
  .hero-bg.hero-bg-multi{display:flex;gap:2px;background:none;}
  .hero-bg-multi span{flex:1;min-width:0;background-size:cover;background-position:center top;}
  .hero-multi{
    font-size:13.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:#fff;background:rgba(43,13,4,.82);padding:5px 11px;border-radius:999px;
  }
  .modal-posters{display:flex;gap:2px;width:100%;}
  .modal-posters .modal-poster{flex:1;min-width:0;width:auto;border-radius:0;padding:10px 8px;}
  .modal-posters .modal-poster:first-child{border-top-left-radius:24px;}
  .modal-posters .modal-poster:last-child{border-top-right-radius:24px;}
  .modal-posters .poster-zoom{right:8px;bottom:8px;padding:6px 10px 6px 8px;font-size:13px;}
  .names{display:block;min-width:0;}
  .names .nm{display:block;overflow-wrap:break-word;}
  .names-inline{display:flex;flex-wrap:wrap;column-gap:.3em;font-size:clamp(24px,7vw,30px);}
  .names-inline .nm{min-width:0;}
  .hero-meta-stack .hero-note{font-style:italic;}
  @media (max-width:359px){ .card-artist .names{font-size:17.5px;} }
  .video-badge-btn + .video-badge-btn{margin-top:10px;}
  .modal-eyebrow{
    font-size:13.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--accent-text);margin-bottom:5px;
  }
  .modal-title{
    font-family:var(--font-display);font-weight:800;font-size:30px;
    margin:0 0 6px;line-height:1.05;
  }
  .modal-meta{font-size:16.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
  .reminder-btn{
    appearance:none;font-family:var(--font-body);text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:13px 18px;border-radius:100px;margin-bottom:14px;
    background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line);
    font-weight:700;font-size:16px;cursor:pointer;box-sizing:border-box;
  }
  .reminder-btn svg{width:17px;height:17px;flex:none;}
  .reminder-btn:active{background:var(--surface);}
  .modal-cta{
    appearance:none;border:none;font-family:var(--font-body);
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px 18px;border-radius:100px;
    background:var(--accent-2);color:var(--accent-2-ink);
    font-weight:700;font-size:17px;text-decoration:none;
    box-sizing:border-box;text-align:center;cursor:pointer;
  }
  .modal-cta svg{width:15px;height:15px;flex:none;}
  .modal-cta .addr{overflow-wrap:anywhere;}
  .modal-cta.is-copied{background:var(--accent);color:var(--accent-ink);}
  .modal-note{
    display:block;text-align:center;color:var(--muted);
    font-size:16px;padding:12px 0;
  }
  body.modal-open{overflow:hidden;}

  /* Message prêt à envoyer (aide à l'écriture) */
  .modal-message{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .modal-message-title{
    font-family:var(--font-display);font-weight:800;font-size:19px;
    margin:0 0 4px;color:var(--ink);
  }
  .help-banner{
    display:flex;gap:12px;align-items:flex-start;
    background:#b3321f;color:#fff;border-radius:16px;padding:16px 16px 16px 14px;margin:0 0 18px;
  }
  .help-banner-icon{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.2);border-radius:50%;}
  .help-banner-icon svg{width:20px;height:20px;}
  .help-banner p{margin:0;}
  .help-banner-kicker{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85;margin-bottom:10px !important;}
  .help-banner-title{font-family:var(--font-display);font-weight:800;font-size:16.5px;line-height:1.3;text-transform:uppercase;letter-spacing:.2px;}
  .help-banner .nowrap{white-space:nowrap;}
  .help-banner-warn{font-size:15.5px;line-height:1.4;margin-top:8px !important;font-weight:600;}
  .help-banner-first{margin-top:14px !important;}
  .modal-message-sub{font-size:14.5px;color:var(--muted);margin:0 0 14px;line-height:1.4;}
  .places-stepper{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;font-size:16px;font-weight:700;color:var(--ink);
  }
  .stepper-controls{display:flex;align-items:center;gap:14px;}
  .stepper-controls button{
    appearance:none;border:none;width:34px;height:34px;border-radius:50%;
    background:var(--surface-2);color:var(--ink);font-size:21px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper-controls button:active{transform:scale(.92);}
  .stepper-count{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:18px;}
  .field-label{display:block;font-size:14.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field-input{
    width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-family:var(--font-body);font-size:16.5px;margin-bottom:16px;
  }
  .field-input:focus{outline:2px solid var(--accent-2);outline-offset:1px;border-color:var(--accent-2);}
  .places-stepper + .places-stepper{margin-top:10px;}
  .stepper-group{margin-bottom:16px;}
  .stepper-group-title{
    font-size:14px;font-weight:800;color:var(--accent-2-ink,var(--accent-2));
    text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;
  }
  .stepper-group-title{
    display:flex;align-items:center;gap:8px;
    background:var(--accent-2);color:var(--accent-2-ink);
    padding:9px 12px;border-radius:10px;line-height:1.25;overflow-wrap:anywhere;
  }
  @media (max-width:350px){.stepper-group-title{font-size:12px;letter-spacing:0;padding:9px 10px;gap:6px;}}
  .stepper-group-title .ear-off{width:22px;height:22px;flex:none;}
  .vest-group{border:0;padding:0;min-width:0;margin-left:0;margin-right:0;}
  .vest-group legend{padding:9px 12px;display:block;width:100%;box-sizing:border-box;}
  .vest-options{display:flex;gap:10px;margin-bottom:12px;}
  .vest-option{flex:1;position:relative;display:block;cursor:pointer;}
  .vest-option input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .vest-option span{
    display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;
    border:2px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:17px;font-weight:800;
  }
  .vest-option input:checked + span{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-2-ink);}
  .vest-option input:focus-visible + span{outline:3px solid var(--accent-2);outline-offset:2px;}
  .message-preview{
    white-space:pre-wrap;font-family:var(--font-body);font-size:15.5px;line-height:1.55;
    background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:16px 0 12px;color:var(--ink);max-height:220px;overflow-y:auto;
  }
  .modal-copy-message{
    appearance:none;border:none;font-family:var(--font-body);cursor:pointer;
    display:block;width:100%;padding:13px 16px;border-radius:100px;
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16.5px;
  }
  .modal-copy-message.is-copied{background:var(--accent-2);color:var(--accent-2-ink);}

  /* Étapes "Préparer votre mail" — pictogrammes + libellés courts,
     pensés pour un public sourd très visuel et peu à l'aise en lecture. */
  .msg-step{margin-bottom:22px;}
  .msg-step-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .msg-step-icon{
    flex:none;width:34px;height:34px;border-radius:50%;
    background:var(--accent-2);color:var(--accent-2-ink);
    display:flex;align-items:center;justify-content:center;
  }
  .msg-step-icon svg{width:18px;height:18px;}
  .msg-step-label{font-family:var(--font-display);font-weight:800;font-size:17.5px;color:var(--ink);}
  .msg-step-hint{font-size:15.5px;color:var(--muted);margin:0 0 10px;line-height:1.5;}
  .msg-address-chip{
    display:block;background:var(--surface-2);border:2px dashed var(--accent-2);
    border-radius:14px;padding:13px 16px;font-weight:800;font-size:17px;
    color:var(--ink);text-align:center;overflow-wrap:anywhere;margin:0;
  }

  .empty{
    text-align:center;
    padding:52px 24px 40px;
    color:var(--muted);
  }
  .empty .mark{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;}
  .empty h2{
    font-family:var(--font-display);
    font-size:23px;font-weight:700;color:var(--ink);margin:0 0 8px;
  }
  .empty p{font-size:16.5px;line-height:1.5;max-width:36ch;margin:0 auto;}

  /* Petit mot festif tout en bas de la liste, pour donner envie de revenir */
  .coming-soon{
    position:relative;overflow:hidden;
    margin:8px 0 30px;border-radius:20px;padding:30px 20px 26px;text-align:center;
    background:linear-gradient(150deg, #b3321f 0%, #b45309 100%);
    color:#fff;box-shadow:var(--shadow);
  }
  .coming-soon-title{
    font-family:var(--font-display);font-weight:800;font-size:26px;
    text-transform:uppercase;letter-spacing:.5px;line-height:1.15;margin:8px 0 8px;
  }
  .coming-soon-sub{
    font-size:16px;margin:0 auto;opacity:.95;max-width:32ch;
  }

  footer{
    max-width:640px;margin:34px auto 0;padding:16px 20px 4px;
    text-align:center;font-size:14px;color:var(--muted);
    border-top:1px solid var(--line);
  }
  footer a{color:var(--accent-text);text-decoration:none;font-weight:700;}

  .install-wrap{margin:0 auto 14px;max-width:420px;}
  .install-btn{
    appearance:none;font-family:var(--font-body);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:13px 18px;border-radius:100px;box-sizing:border-box;
    background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line);
    font-weight:700;font-size:16px;
  }
  .install-btn svg{width:18px;height:18px;flex:none;}
  .install-btn:active{background:var(--surface);}
  .install-help{
    margin-top:10px;padding:14px 16px;border-radius:16px;text-align:left;
    background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);
    font-size:15px;line-height:1.5;
  }
  .install-help p{margin:0 0 8px;}
  .install-help p:last-child{margin-bottom:0;}
  .install-copy{font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;border:2px solid var(--accent-2);background:var(--surface);color:var(--ink);cursor:pointer;}

  .install-help strong{font-weight:700;}


  .install-top{margin:14px 0 12px;}
  .install-top-row{display:flex;align-items:center;gap:8px;}
  .install-btn-top{flex:1;background:var(--accent-2);color:var(--accent-2-ink);border-color:transparent;font-size:17px;padding:14px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .install-btn-top:active{filter:brightness(.95);background:var(--accent-2);}
  .install-dismiss{appearance:none;flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;
    background:var(--surface-2);color:var(--muted);border:1.5px solid var(--line);font-size:24px;line-height:1;font-family:var(--font-body);}
  .install-again{display:inline-block;margin-bottom:10px;}

  .card.is-soon{filter:grayscale(1);opacity:.6;cursor:default;pointer-events:none;user-select:none;}
  .card.is-soon .soon-ph{background:var(--line);border-radius:12px;}
  .card.is-soon .soon-label{font-weight:700;font-size:17px;color:var(--muted);font-style:italic;overflow-wrap:anywhere;hyphens:auto;}

  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
  }

  /* ===== Bascule Liste / Carte ===== */
  .view-switch{display:flex;gap:8px;margin:2px 0 14px;padding:5px;background:var(--surface);border:2px solid var(--line);border-radius:18px;}
  .vs-btn{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;border-radius:13px;
    font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.3px;text-transform:uppercase;transition:background .15s ease,color .15s ease;}
  .vs-btn svg{width:26px;height:26px;flex:none;}
  .vs-btn.is-on{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 #8e2616;}
  .vs-btn:not(.is-on):active{background:var(--surface-2);}
  .vs-btn:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;}

  /* ===== Vue carte ===== */
  #map-slot{padding-bottom:28px;}
  .map-intro{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 2px 10px;}
  .map-intro .n{font-family:var(--font-display);font-weight:800;font-size:27px;color:var(--accent-text);letter-spacing:.2px;}
  .map-intro .h{font-size:16.5px;font-weight:700;color:var(--muted);}
  .map-card{position:relative;border-radius:22px;overflow:hidden;background:#8fd6d1;border:3px solid #fff;box-shadow:var(--shadow);}
  .map-svg{display:block;width:100%;height:auto;}
  .map-svg .land{stroke-linejoin:round;}
  .map-svg .shadow{filter:drop-shadow(0 3px 0 rgba(31,110,112,.38));}
  .map-svg .dep{fill:none;stroke:#f1d9a2;stroke-width:1;vector-effect:non-scaling-stroke;}
  .map-svg .edge{fill:none;stroke:#fff;stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;}
  .map-svg .lbl{font-family:var(--font-display);font-weight:800;letter-spacing:.2em;fill:#9a5b22;opacity:.8;text-anchor:middle;pointer-events:none;text-transform:uppercase;}
  .map-pins{position:absolute;inset:0;}
  .mk{position:absolute;appearance:none;border:0;background:none;padding:0;cursor:pointer;width:48px;height:52px;margin:0;
    transform:translate(-50%,-100%);display:flex;align-items:flex-end;justify-content:center;-webkit-tap-highlight-color:transparent;}
  .mk svg.pin-s{width:34px;height:44px;filter:drop-shadow(0 3px 0 rgba(59,32,19,.28));transition:transform .15s ease;transform-origin:50% 100%;}
  .mk .pf{fill:var(--accent);stroke:#fff;stroke-width:2.6;}
  .mk .pd{fill:#fff;}
  .mk .bd{position:absolute;top:0;right:1px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:11px;background:#182d68;color:#fff;border:2px solid #fff;
    font-family:var(--font-display);font-weight:800;font-size:14px;line-height:18px;text-align:center;}
  .mk.cl{width:50px;height:50px;transform:translate(-50%,-50%);align-items:center;}
  .mk.cl .cc{width:44px;height:44px;border-radius:50%;background:var(--accent);border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;font-size:23px;box-shadow:0 3px 0 rgba(59,32,19,.28);transition:transform .15s ease;}
  .mk.is-sel svg.pin-s{transform:scale(1.22);}
  .mk.is-sel .pf{fill:var(--accent-2);}
  .mk.is-sel .cc{transform:scale(1.18);background:var(--accent-2);color:var(--accent-2-ink);}
  .mk:focus-visible{outline:3px solid var(--accent-2);outline-offset:-4px;border-radius:12px;}
  .map-zoom{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;background:#fff;border-radius:16px;padding:4px;box-shadow:0 2px 0 rgba(59,32,19,.2),0 6px 14px -6px rgba(59,32,19,.4);}
  .map-zoom button{appearance:none;border:0;background:transparent;color:var(--ink);cursor:pointer;min-height:40px;padding:0 14px;border-radius:12px;
    font-family:var(--font-display);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.3px;}
  .map-zoom button.on{background:var(--accent-2);color:var(--accent-2-ink);}
  .map-note{margin:12px 4px 0;font-size:15.5px;font-weight:600;color:var(--muted);line-height:1.35;}
  .map-empty{padding:30px 16px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--ink);}

  /* Fiche du bas */
  .map-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0 auto;max-width:640px;max-height:62vh;overflow:auto;
    background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 34px -8px rgba(59,32,19,.45);padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    border-top:4px solid var(--accent);animation:sheet-in .2s ease;}
  @keyframes sheet-in{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .map-sheet[hidden]{display:none;}
  .ms-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;}
  .ms-title{flex:1;font-family:var(--font-display);font-weight:800;font-size:25px;line-height:1.1;color:var(--accent-text);display:flex;align-items:center;gap:6px;}
  .ms-title svg{width:24px;height:24px;flex:none;color:var(--accent);}
  .ms-close{appearance:none;border:0;background:var(--surface-2);color:var(--ink);width:46px;height:46px;border-radius:50%;font-size:30px;line-height:1;cursor:pointer;flex:none;}
  .ms-row{display:flex;gap:12px;align-items:stretch;padding:10px;margin:0 0 10px;border:2px solid var(--line);border-radius:18px;background:var(--row);cursor:pointer;}
  .ms-row:last-child{margin-bottom:0;}
  .ms-row:focus-visible{outline:3px solid var(--accent-2);}

function parseLocalDate(iso){

function startOfToday(){

function isMailto(link){
  return typeof link === "string" && (link.startsWith("mailto:") || (link.includes("@") && !link.startsWith("http")));
}
function normalizeLink(link){
  if(!link) return null;
  if(link.startsWith("mailto:") || link.startsWith("http")) return link;
  if(link.includes("@")) return "mailto:" + link;
  return "https://" + link;

function mapsUrl(venue, city){
  let name = String(city || "").trim(), tail = "";
  const m = /^(.*?)\s*\(([^)]+)\)\s*$/.exec(name);
  if(m){ name = m[1]; const c = m[2].trim().toUpperCase(); tail = c === "CH" ? "Suisse" : (c === "BE" ? "Belgique" : "France"); }
  const q = [String(venue || "").trim(), name, tail].filter(Boolean).join(", ");
  return IS_IOS ? "https://maps.apple.com/?q=" + encodeURIComponent(q)
                : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

  if(!venue && !city) return inner;

/* Repère "Nouveau" + pastille sur l'icône de l'appli installée, pour les
   concerts ajoutés depuis la dernière visite. Purement côté navigateur
   (localStorage + Badging API) : ça ne prévient personne activement quand
   l'appli est fermée, seulement au moment où la personne la rouvre — une
   vraie notification poussée demanderait un serveur d'envoi, hors de
   portée d'une page statique. Voir aussi : navigator.setAppBadge (Badging
   API), supportée sur appli installée (Android/Chrome, desktop, iOS 16.4+). */
const SEEN_EVENTS_KEY = "chansigne_seen_event_ids_v1";

function getSeenEventIds(){
  // null = première visite (aucun historique) : on ne veut pas marquer
  // tous les concerts déjà en ligne comme "Nouveau" dans ce cas.
  try {
    const raw = localStorage.getItem(SEEN_EVENTS_KEY);
    return raw ? new Set(JSON.parse(raw)) : null;
  } catch(err){
    return null;
  }
}
function setSeenEventIds(ids){
  try { localStorage.setItem(SEEN_EVENTS_KEY, JSON.stringify(Array.from(ids))); }
  catch(err){ /* stockage indisponible (navigation privée…) : tant pis */ }
}
function updateAppBadge(count){
  try {
    if(count > 0 && "setAppBadge" in navigator) navigator.setAppBadge(count);
    else if("clearAppBadge" in navigator) navigator.clearAppBadge();
  } catch(err){ /* Badging API non dispo (appli non installée, navigateur non compatible…) */ }
}

/* Regroupe les concerts d'une même soirée (même date, même lieu, même
   adresse de réservation) : une seule carte, un seul moyen de réserver. */
function placeLines(e){
  return { venue: e.venue || "", city: e.city || "", time: timeText(e) };
}
function namesHtml(g, inline){
  if(!g.multi) return escapeHtml(g.artist);
  return `<span class="names${inline ? " names-inline" : ""}">${g.members.map((m,i) => `<span class="nm">${i ? "+\u00a0" : ""}${escapeHtml(m.artist)}</span>`).join("")}</span>`;
}

function placeMiniHtml(){ return `<span class="place-mini" aria-hidden="true"><img src="${PLACE_MINI}" alt=""></span>`; }
function updateCardBadges(){
  document.querySelectorAll(".card[data-id]").forEach(c => {
    const g = GROUPS.find(x => x.id === c.dataset.id);
    const has = !!(g && !g.cancelled && placementOf(g));
    const cur = c.querySelector(".place-mini");
    c.classList.toggle("has-place", has);
    const lab = c.getAttribute("aria-label") || "", suf = " — placement des chansigneurs disponible";
    c.setAttribute("aria-label", has ? (lab.endsWith(suf) ? lab : lab + suf) : lab.replace(suf,""));
    if(has && !cur) c.insertAdjacentHTML("afterbegin", placeMiniHtml());
    if(!has && cur) cur.remove();
  });
}
function placementOf(g){ return (g.members || [g]).map(m => PLACEMENT[m.id]).find(p => p && SCENES[p]) || null; }
let currentGroup = null;
function renderWhere(e){
  const wrap = document.getElementById("modal-where-wrap");
  if(e.cancelled || e.soon){ wrap.innerHTML = ""; return; }
  const items = placementItems(e);
  const known = items.filter(x => x.pos);
  const same = known.length === items.length && new Set(known.map(x => x.pos)).size === 1;
  // 0 connu : message ; tous identiques : une seule image ; sinon : une image par artiste
  const mode = !known.length ? "none" : (same ? "one" : "stack");
  wrap.innerHTML = `<button type="button" class="video-badge-btn place-badge-btn" id="where-btn" aria-controls="where-info"${mode === "none" ? ' aria-expanded="false"' : ""}>
      <span class="video-badge-img-wrap"><img src="${placeBadgeImg}" alt=""></span>
      <span class="video-badge-label">Placement des chansigneurs<small>Touchez pour voir</small></span>
    </button>
    <div class="where-info" id="where-info" role="status" hidden>À consulter le jour du concert</div>`;
  const btn = document.getElementById("where-btn"), info = document.getElementById("where-info");
  btn.addEventListener("click", () => {
    if(mode === "one"){
      lastPosterBtn = btn;
      openLightbox(sceneSrc(known[0].pos), SCENE_INFO[known[0].pos].alt, true);
    } else if(mode === "stack"){
      lastPosterBtn = btn;
      openLightboxStack(items);
    } else {
      const open = info.hidden;
      info.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    }
  });
}

    if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n") i++; row.push(cur); cur=""; rows.push(row); row=[]; }

function isoDate(v){
  v=String(v||"").trim();

  if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;

function buildGroups(list){
  const out = [], idx = new Map();
  for(const e of list){
    const link = (!e.soon && !e.cancelled) ? normalizeLink(e.link) : null;
    if(!link){ out.push(Object.assign({}, e, {members:[e]})); continue; }
    const key = [e.date, e.venue, e.city || "", link].join("|");
    if(idx.has(key)){ idx.get(key).members.push(e); continue; }
    const g = Object.assign({}, e, {members:[e]});
    idx.set(key, g); out.push(g);
  }
  for(const g of out){
    const m = g.members;
    g.multi = m.length > 1;
    const seenImg = new Set();
    g.posters = [];
    for(const x of m){
      if(x.image && !seenImg.has(x.image)){ seenImg.add(x.image); g.posters.push({src:x.image, artist:x.artist}); }
    }
    const seenVid = new Set();
    g.videos = [];
    for(const x of m){
      if(x.video && !seenVid.has(x.video)){ seenVid.add(x.video); g.videos.push({url:x.video, artist:x.artist}); }
    }
    if(g.multi){
      g.artist = m.map(x => x.artist).join(" + ");
      g.artistsAnd = m.slice(0,-1).map(x => x.artist).join(", ") + " et " + m[m.length-1].artist;
      g.image = g.posters.length ? g.posters[0].src : null;
      const times = Array.from(new Set(m.map(x => timeText(x)).filter(Boolean)));
      if(times.length === 1 && m.every(x => timeText(x) === times[0])){
        g.time = m[0].time || null; g.timeLabel = m[0].timeLabel || null; g.timePrefix = m[0].timePrefix || null; g.timeNote = m[0].timeNote || null;
      } else {
        g.time = null; g.timePrefix = null; g.timeNote = null; g.timeLabel = times.join(" · ") || null;
      }
    } else {
      g.artistsAnd = g.artist;
    }
  }

}

const EVENTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQSLGkhGvXbLbt9JNJN4WoOfmdmxLMcdrFS5sxSACwWtTBOFvVAb9xvmnKiJKQVfg1kR3R2uiyjXAhU/pub?gid=1608066561&single=true&output=csv";

function cityLabel(ville, dpt, pays){
  ville = String(ville||"").trim(); if(!ville) return null;
  const p = normName(pays), d = String(dpt||"").trim();
  if(d && (!p || p === "france")) return `${ville} (${d})`;
  if(p && p !== "france") return `${ville} (${COUNTRY_CODE[p] || String(pays).trim()})`;
  return ville;
}
function csvEvents(text){
  const rows = parseCsv(text);
  if(rows.length < 2) return null;
  const head = rows[0].map(x => normName(x).replace(/ /g,"_"));
  const col = n => head.indexOf(n);
  if(["ref","date","artiste"].some(n => col(n) < 0)) return null;
  const out = [];
  for(const r of rows.slice(1)){
    const g = n => { const i = col(n); return i < 0 ? "" : String(r[i] || "").trim(); };
    const ref = g("ref"), date = isoDate(g("date"));
    if(!ref || !date) continue;
    if(ref === "conf"){
      out.push({id:date+"-a-venir", soon:true, artist:"", venue:"", city:null, date, time:null, link:null, linkLabel:null, image:null, note:null, cancelled:false});
      continue;
    }
    const artist = g("artiste");
    if(!artist) continue;
    const hm = g("heure").match(/^(\d{1,2})[:h](\d{2})$/);
    const url = /^https:\/\//i.test(g("lien")) ? g("lien") : "";
    const mail = g("email").replace(/\(arobase\)/gi,"@");
    const e = {
      id: date + "-" + normName(artist).replace(/ /g,"-"),
      artist, venue: g("lieu"), city: cityLabel(g("ville"), g("dpt"), g("pays")), date,
      time: hm ? hm[1].padStart(2,"0") + ":" + hm[2] : null,
      link: url || (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) ? "mailto:" + mail : null),
      linkLabel: "Réserver", note: null,
      cancelled: /^(oui|yes|true|1|x|✔)/i.test(g("annule")),
      _ref: ref
    };
    if(g("avant_heure")) e.timePrefix = g("avant_heure");
    if(g("precisions")) e.timeNote = g("precisions");
    if(/^https:\/\//i.test(g("video"))) e.video = g("video");
    out.push(e);
  }
  return out;
}
function postersOk(){ try{ return JSON.parse(localStorage.getItem(POSTERS_OK_KEY) || "[]"); }catch(_){ return []; } }
function applyEventsCsv(text){
  const live = csvEvents(text);
  if(!live || !live.some(e => !e.soon)) return false;   // garde-fou : on garde les données intégrées
  const today = startOfToday(), ok = new Set(postersOk());
  const byKey = new Map(BASE_EVENTS.filter(b => !b.soon).map(b => [b.date + "|" + normName(b.artist), b]));
  const out = [], used = new Set();
  for(const f of live){
    if(f.soon){ out.push(f); continue; }
    const b = byKey.get(f.date + "|" + normName(f.artist));
    if(b){
      used.add(b.id);
      const m = Object.assign({}, b, f); delete m._ref;
      for(const k of ["video","timePrefix","timeNote"]) if(f[k] === undefined) delete m[k];
      out.push(m);
    } else {
      f.image = (/^[0-9a-f]{10}$/.test(f._ref) && ok.has(f._ref)) ? "ev-" + f._ref + ".jpg" : null;
      out.push(f);
    }
  }
  // les concerts passés restent dans l'appli (jamais supprimés), même absents du tableau
  for(const b of BASE_EVENTS) if(!b.soon && !used.has(b.id) && parseLocalDate(b.date) < today) out.push(b);
  EVENTS = out; GROUPS = buildGroups(EVENTS);
  return true;

// Affiche d'un nouveau concert : on ne l'utilise que si le fichier existe vraiment.
function probePosters(){
  const todo = EVENTS.filter(e => e._ref && !e.image && /^[0-9a-f]{10}$/.test(e._ref));
  if(!todo.length) return;
  Promise.all(todo.map(e => fetch("th-" + e._ref + ".jpg", {method:"HEAD", cache:"no-cache"}).then(r => { if(r.ok){ e.image = "ev-" + e._ref + ".jpg"; return e._ref; } }).catch(() => {})))
    .then(refs => {
      refs = refs.filter(Boolean);
      if(!refs.length) return;
      try{ localStorage.setItem(POSTERS_OK_KEY, JSON.stringify(Array.from(new Set(postersOk().concat(refs))))); }catch(_){}
      GROUPS = buildGroups(EVENTS); render(); updateCardBadges();
    });
}
function refreshEvents(force){
  if(!EVENTS_CSV_URL) return;
  if(!force && Date.now() - eventsFetchedAt < 60000) return;
  eventsFetchedAt = Date.now();
  fetch(EVENTS_CSV_URL, {cache:"no-store"}).then(r => r.ok ? r.text() : Promise.reject()).then(t => {
    if(t === lastEventsText) return;
    if(!applyEventsCsv(t)) return;
    lastEventsText = t;
    try{ localStorage.setItem(EVENTS_CACHE_KEY, t); }catch(_){}
    if(placementText) applyPlacementCsv(placementText);
    render(); updateCardBadges(); probePosters();
  }).catch(()=>{});
}

/* Copie dans le presse-papier, avec repli pour les navigateurs qui
   n'ont pas l'API Clipboard (ou la refusent hors contexte sécurisé). */
async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch(err){
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch(err2){
      return false;
    }
  }
}

/* Message pré-rempli, pensé pour les personnes sourdes qui ont du mal
   à rédiger : il suffit de le copier et de l'envoyer tel quel. */
function buildReservationMessage(artist, pshAdults, pshChildren, companionAdults, companionChildren, name, multiDate, vest){
  const pa = Math.max(0, pshAdults);
  const pc = Math.max(0, pshChildren);
  const ca = Math.max(0, companionAdults);
  const cc = Math.max(0, companionChildren);
  const who = name && name.trim() ? `Je m'appelle ${name.trim()}, je` : "Je";

  const pshLines = [];
  if(pa > 0) pshLines.push(`- ${pa} adulte${pa > 1 ? "s" : ""}`);
  if(pc > 0) pshLines.push(`- ${pc} enfant${pc > 1 ? "s" : ""}`);

  const companionLines = [];
  if(ca > 0) companionLines.push(`- ${ca} adulte${ca > 1 ? "s" : ""}`);
  if(cc > 0) companionLines.push(`- ${cc} enfant${cc > 1 ? "s" : ""}`);

  const pshBlock = pshLines.length
    ? `\nPersonnes sourdes/malentendantes :\n${pshLines.join("\n")}\n`
    : "";

  const companionBlock = companionLines.length
    ? `\nPersonnes accompagnantes (sans handicap) :\n${companionLines.join("\n")}\n`
    : "";

  // Gilets vibrants : "oui" ajoute un bloc dédié (+ nombre si renseigné),
  // "non" retire la question, sans réponse on garde la question d'origine.
  const vestWant = vest && vest.want;
  const vestCount = vest && vest.count ? String(vest.count).trim() : "";
  const vestBlock = vestWant === "yes"
    ? `\nGilets vibrants :\n- S'il y a des gilets vibrants, je suis intéressé(e).${vestCount ? `\n- Nombre de gilets vibrants que je souhaite réserver : ${vestCount}` : ""}\n`
    : "";
  const vestQuestion = vestWant === "yes"
    ? "\n- Comment réserver les gilets vibrants et où les récupérer."
    : (vestWant === "no" ? "" : "\n- S'il y a des gilets vibrants, où les récupérer.");

  const signature = name && name.trim() ? `Bien cordialement.\n${name.trim()}` : "Bien cordialement.";

  return `Bonjour,

${who} suis sourd(e), je souhaite réserver des places pour ${multiDate ? `la soirée chansignée du ${multiDate}, avec ${artist}` : `le concert chansigné de ${artist}`}.
${pshBlock}${companionBlock}${vestBlock}
Merci de m'indiquer :
- Comment acheter mes places.
- Y a-t-il un tarif réduit ?
- Où me rendre le jour J, et à quelle heure, pour assister ${multiDate ? "à la soirée chansignée" : "au concert chansigné"}.${vestQuestion}

Pour faciliter ma compréhension, merci de privilégier une réponse claire et avec des phrases simples.

En vous remerciant.
${signature}`;
}

/* Rappel calendrier — sans serveur, sans fichier téléchargé (les pages
   publiées ici ne peuvent pas proposer de téléchargement de fichier aux
   visiteurs : le navigateur bloque tout data:/blob: déclenché par la page).
   Solution fiable : un lien "Ajouter à Google Agenda" prérempli, qui
   fonctionne comme un lien de réservation classique. Les horaires sont
   convertis en UTC en tenant compte de l'heure d'été/hiver française. */
// Horaire affiché : heure précise (time) ou libellé libre (timeLabel, ex. "Soirée")
function timeText(e){
  if(e.time) return (e.timePrefix ? e.timePrefix + " " : "") + e.time.replace(":", "h");
  return e.timeLabel || "";
}
function noteText(e){ return e.timeNote ? e.timeNote.charAt(0).toUpperCase() + e.timeNote.slice(1) : ""; }
function pad2(n){ return String(n).padStart(2,"0"); }
function parisUtcOffsetHours(y, m, d){
  // Règle européenne : heure d'été du dernier dimanche de mars (UTC+2)
  // au dernier dimanche d'octobre (retour à UTC+1).
  function lastSundayUTC(year, monthIndex){
    const last = new Date(Date.UTC(year, monthIndex + 1, 0));
    last.setUTCDate(last.getUTCDate() - last.getUTCDay());
    return last.getTime();
  }
  const check = Date.UTC(y, m, d);
  const dstStart = lastSundayUTC(y, 2);  // mars
  const dstEnd = lastSundayUTC(y, 9);    // octobre
  return (check >= dstStart && check < dstEnd) ? 2 : 1;
}
function buildGoogleCalendarUrl(e){
  const dt = parseLocalDate(e.date);
  const y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
  const text = `${e.artist} — ${e.multi ? "concerts chansignés" : "concert chansigné"}`;
  const details = "Concert traduit en langue des signes par 10 Doigts en Cavale.";
  const location = [e.venue, e.city].filter(Boolean).join(", ");

  let datesParam;
  if(e.time){
    const [h, min] = e.time.split(":").map(Number);
    const offset = parisUtcOffsetHours(y, m, d);
    const startMs = Date.UTC(y, m, d, h, min) - offset * 3600000;
    const endMs = startMs + 2 * 3600000; // durée par défaut : 2h
    const fmt = ms => {
      const u = new Date(ms);
      return `${u.getUTCFullYear()}${pad2(u.getUTCMonth()+1)}${pad2(u.getUTCDate())}T${pad2(u.getUTCHours())}${pad2(u.getUTCMinutes())}00Z`;
    };
    datesParam = `${fmt(startMs)}/${fmt(endMs)}`;
  } else {
    const end = new Date(y, m, d + 1);
    const fmtDate = dd => `${dd.getFullYear()}${pad2(dd.getMonth()+1)}${pad2(dd.getDate())}`;
    datesParam = `${fmtDate(dt)}/${fmtDate(end)}`;
  }

  const params = new URLSearchParams({ action: "TEMPLATE", text, dates: datesParam, details, location });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

         <img src="${p.src}" alt="Affiche du concert : ${escapeHtml(p.artist)}" decoding="async">
         <span class="poster-zoom">${iconZoom} Agrandir</span>
       </button>`;
  modalImageWrap.innerHTML = e.posters.length > 1
    ? `<div class="modal-posters">${e.posters.map(posterHtml).join("")}</div>`
    : e.posters.length ? posterHtml(e.posters[0], 0) : "";
  modalImageWrap.querySelectorAll(".modal-poster").forEach(btn => {
    const p = e.posters[Number(btn.dataset.poster)];
    btn.addEventListener("click", () => { lastPosterBtn = btn; openLightbox(p.src, "Affiche du concert : " + p.artist); });
  });
  modalEl.scrollTop = 0;
  document.querySelector(".modal-panel").scrollTop = 0;

  // Vignette "Vidéo en LSF" — tout en haut du formulaire, avant le reste,
  // pour un public sourd très visuel : image = message, avant même le texte.
  // La vidéo est hébergée à l'extérieur (ex. Facebook) et simplement liée
  // ici : l'intégrer directement dans la page (base64) empêchait le
  // partage public de cette page (contrôle de sécurité automatique).
  if(e.videos.length){
    modalVideoWrap.innerHTML = e.videos.map(v => `
      <a class="video-badge-btn" href="${v.url}" target="_blank" rel="noopener" data-video-url="${escapeHtml(v.url)}" data-video-artist="${escapeHtml(v.artist)}" aria-label="Regarder la vidéo en langue des signes${e.videos.length > 1 ? " : " + escapeHtml(v.artist) : ""}">
        <span class="video-badge-img-wrap">
          <img src="${videoBadgeImg}" alt="">
          <span class="video-badge-play">${iconPlay}</span>
        </span>
        <span class="video-badge-label">Vidéo en LSF<small>${e.videos.length > 1 ? escapeHtml(v.artist) : "Touchez pour la regarder"}</small></span>
      </a>`).join("");
  } else {
    modalVideoWrap.innerHTML = "";
  }

  modalEyebrow.textContent = e.cancelled ? "Concert annulé" : (e.multi ? `Détails de la soirée · ${e.members.length} artistes` : "Détails du concert");
  modalTitle.innerHTML = namesHtml(e, true);
  const placeTxt = [e.venue ? e.venue + (noteText(e) ? " (" + e.timeNote + ")" : "") : "", e.city].filter(Boolean).join(", ");
  modalMeta.innerHTML = escapeHtml(dateStr) + (placeTxt ? " — " + geoLink(e.venue, e.city, iconPin + escapeHtml(placeTxt), "geo-main") : "");

  currentGroup = e;
  renderWhere(e);

  // Rappel calendrier — utile quel que soit le mode de réservation (mail
  // ou site web), donc affiché pour tout concert qui n'est pas annulé.
  if(e.cancelled){
    modalReminderWrap.innerHTML = "";
  } else {
    modalReminderWrap.innerHTML = `<a class="reminder-btn" href="${buildGoogleCalendarUrl(e)}" target="_blank" rel="noopener">${iconCalendar} Ajouter à Google Agenda</a>`;
  }

  const link = e.cancelled ? null : normalizeLink(e.link);
  const mailAddress = link && isMailto(link) ? link.replace(/^mailto:/,"") : null;
  if(link){
    const mail = isMailto(link);
    if(mail){
      // Un mailto: dépend d'une appli mail réglée par défaut sur l'appareil —
      // pas fiable à 100 % partout, mais c'est ce qui rapproche le plus d'un
      // envoi "en un clic" dans une page web statique. Le bouton qui prépare
      // et ouvre le mail (destinataire, sujet, corps déjà remplis) est plus
      // bas, dans la section "Réserver par mail", une fois les champs saisis
      // — pas besoin de répéter la consigne ici.
      modalCtaWrap.innerHTML = "";
    } else {
      const address = link.replace(/^https?:\/\//,"");
      modalCtaWrap.innerHTML = `<a class="modal-cta" href="${link}" target="_blank" rel="noopener">${iconTicket} ${escapeHtml(e.linkLabel || "Réserver")} — <span class="addr">${escapeHtml(address)}</span></a>`;
    }
  } else if(e.cancelled){
    modalCtaWrap.innerHTML = `<span class="modal-note">Ce concert est annulé, il n'est plus possible de réserver.</span>`;
  } else if(e.note){
    modalCtaWrap.innerHTML = `<span class="modal-note">${escapeHtml(e.note)}</span>`;
  } else {
    modalCtaWrap.innerHTML = "";
  }

  // Message prêt à envoyer, pour aider à écrire à l'organisateur — utile
  // quand il faut écrire un mail, inutile quand un lien de réservation
  // (site web) est déjà cliquable juste au-dessus.
  const isWebsiteLink = !!(link && !mailAddress);
  if(e.cancelled || isWebsiteLink){
    modalMessageWrap.innerHTML = "";
  } else {
    const stepperGroupsHtml = `
      <div class="stepper-group">
        <p class="stepper-group-title">${iconEarOff}<span>Personnes sourdes/malentendantes</span></p>
        <div class="places-stepper">
          <span>Adulte(s)</span>
          <div class="stepper-controls">
            <button type="button" id="psh-adults-minus" aria-label="Moins d'adultes en situation de handicap">−</button>
            <span class="stepper-count" id="psh-adults-count">0</span>
            <button type="button" id="psh-adults-plus" aria-label="Plus d'adultes en situation de handicap">+</button>
          </div>
        </div>
        <div class="places-stepper">
          <span>Enfant(s)</span>
          <div class="stepper-controls">
            <button type="button" id="psh-children-minus" aria-label="Moins d'enfants en situation de handicap">−</button>

      </div>

      <div class="stepper-group">
        <p class="stepper-group-title">Personnes accompagnantes (sans handicap)</p>
        <div class="places-stepper">
          <span>Adulte(s)</span>
          <div class="stepper-controls">
            <button type="button" id="comp-adults-minus" aria-label="Moins d'accompagnants adultes">−</button>
            <span class="stepper-count" id="comp-adults-count">0</span>
            <button type="button" id="comp-adults-plus" aria-label="Plus d'accompagnants adultes">+</button>
          </div>
        </div>
        <div class="places-stepper">
          <span>Enfant(s)</span>
          <div class="stepper-controls">
            <button type="button" id="comp-children-minus" aria-label="Moins d'accompagnants enfants">−</button>
            <span class="stepper-count" id="comp-children-count">0</span>
            <button type="button" id="comp-children-plus" aria-label="Plus d'accompagnants enfants">+</button>
          </div>
        </div>
      </div>

      <fieldset class="stepper-group vest-group">
        <legend class="stepper-group-title">S'il y a des gilets vibrants, je suis intéressé(e) :</legend>
        <div class="vest-options">
          <label class="vest-option"><input type="radio" name="vest-want" id="vest-yes" value="yes"><span>Oui</span></label>
          <label class="vest-option"><input type="radio" name="vest-want" id="vest-no" value="no"><span>Non</span></label>
        </div>
        <div class="vest-count-wrap" id="vest-count-wrap" hidden>
          <label class="field-label" for="vest-count">Nombre de gilets vibrants que je souhaite réserver :</label>
          <input type="text" id="vest-count" class="field-input" inputmode="numeric" maxlength="20" placeholder="Ex. : 2" autocomplete="off">
        </div>

    if(mailAddress){
      // Pas de véritable envoi possible depuis une page web statique : le
      // plus fiable reste de faire copier le message (avec l'adresse) en un
      // seul geste, puis de laisser la personne l'envoyer depuis sa propre
      // appli mail. Présenté en 3 étapes visuelles avec pictogrammes, pour
      // un public sourd très à l'aise avec l'image mais peu avec la lecture.
      modalMessageWrap.innerHTML = `
        <div class="modal-message">
          <div class="help-banner" role="note">
            <span class="help-banner-icon">${iconMail}</span>
            <div>
              <p class="help-banner-kicker">Besoin d'aide ?</p>
              <p class="help-banner-title">Vous souhaitez écrire au festival / à la salle pour réserver vos places ?</p>
              <p class="help-banner-warn help-banner-first">Remplissez le formulaire</p>

              <p class="help-banner-warn">Copiez et envoyez le message <span class="nowrap">vous-même</span> à l'organisateur.</p>
            </div>
          </div>

          <div class="msg-step">
            <div class="msg-step-head">
              <span class="msg-step-icon">${iconEdit}</span>
              <span class="msg-step-label">1. Compléter votre demande</span>
            </div>
            <label class="field-label" for="msg-name">Votre nom et prénom</label>
            <input type="text" id="msg-name" class="field-input" placeholder="Ex. : Camille Dupont" autocomplete="name">
            ${stepperGroupsHtml}

          <div class="msg-step">
            <div class="msg-step-head">
              <span class="msg-step-icon">${iconCopy}</span>
              <span class="msg-step-label">2. Copier le message</span>
