<!doctype html>
<html lang="fr" data-theme="light"><head>
<meta charset="utf-8">
<title>Agenda Chansigné</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda Chansigné">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<meta name="theme-color" content="#e0432c">
<meta name="description" content="Les concerts chansignés à venir — 10 Doigts en Cavale.">
<style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  :root{
    --bg:#d9f0f2;
    --surface:#ffffff;
    --surface-2:#c3e6e9;
    --ink:#3b2013;
    --muted:#8c7460;
    --line:#b3dade;
    --accent:#e0432c;
    --accent-ink:#ffffff;
    --accent-2:#f0a028;
    --accent-2-ink:#3b2013;
    --teal:#8fc7bc;
    --teal-deep:#3f8f83;
    --shadow: 0 1px 2px rgba(59,32,19,.08), 0 8px 24px -12px rgba(59,32,19,.24);
    --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a2226;
      --surface:#123033;
      --surface-2:#163a3d;
      --ink:#fbefe0;
      --muted:#cbaf94;
      --line:#1f4a4e;
      --accent:#ff6a4d;
      --accent-ink:#2b0d04;
      --accent-2:#ffb648;
      --accent-2-ink:#2c1c05;
      --teal:#8fc7bc;
      --teal-deep:#3f8f83;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a2226;
    --surface:#123033;
    --surface-2:#163a3d;
    --ink:#fbefe0;
    --muted:#cbaf94;
    --line:#1f4a4e;
    --accent:#ff6a4d;
    --accent-ink:#2b0d04;
    --accent-2:#ffb648;
    --accent-2-ink:#2c1c05;
    --teal:#8fc7bc;
    --teal-deep:#3f8f83;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  a{color:inherit;}
  img{display:block;}

  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px 14px;
    max-width:640px;margin:0 auto;
  }
  .mark{
    width:46px;height:46px;border-radius:13px;flex:none;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(224,67,44,.35);
  }
  .mark img{width:100%;height:100%;object-fit:cover;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:21px;
    letter-spacing:.2px;
    margin:0;
    line-height:1.1;
  }
  .brand p{
    margin:1px 0 0;
    font-size:14.5px;
    color:var(--muted);
    letter-spacing:.2px;
  }

  main{max-width:640px;margin:0 auto;padding:0 16px;}

  /* Hero: next concert */
  .hero{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:var(--accent);
    color:#fff;
    margin:6px 0 28px;
    box-shadow:var(--shadow);
    min-height:220px;
  }
  .hero-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center top;
    filter:saturate(1.05);
  }
  .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(59,20,10,.08) 0%, rgba(59,20,10,.5) 55%, rgba(43,13,4,.92) 100%);
  }
  .hero-noimg{
    position:absolute;inset:0;
    background:
      radial-gradient(130% 150% at 12% -10%, var(--accent-2) 0%, transparent 55%),
      linear-gradient(155deg,var(--accent),#a82a1a 75%);
  }
  .hero-confetti{
    position:absolute;top:16px;left:16px;display:flex;gap:6px;align-items:center;
    opacity:.85;pointer-events:none;
  }
  .hero-confetti span{display:block;width:6px;height:6px;border-radius:50%;background:#fff;}
  .hero-confetti span:nth-child(2){background:var(--accent-2);width:8px;height:8px;}
  .hero-confetti span:nth-child(3){background:var(--teal);width:5px;height:5px;}
  .hero-doodle{
    position:absolute;top:14px;right:14px;width:60px;height:auto;
    opacity:.5;pointer-events:none;
  }
  .hero-inner{
    position:relative;padding:20px 20px 20px;
    display:flex;flex-direction:column;min-height:220px;
  }
  .hero-eyebrow-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .hero-eyebrow{
    font-size:13.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:#ffe6c2;
    display:inline-flex;align-items:center;gap:6px;
  }
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 4px rgba(240,160,40,.35);}
  .hero-title{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(31px,8vw,41px);
    line-height:1;
    margin:10px 0 6px;
    text-wrap:balance;
  }
  .hero-meta{
    font-size:16.5px;
    color:#fff0e2;
    display:flex;flex-wrap:wrap;gap:x;
    row-gap:4px;
  }
  .hero-meta span:not(:last-child)::after{content:"·";margin:0 7px;color:#f0b39e;}
  .hero-actions{margin-top:auto;padding-top:16px;display:flex;gap:10px;flex-wrap:wrap;}

  .btn{
    appearance:none;border:none;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--font-body);font-weight:700;font-size:16.5px;
    padding:11px 18px;border-radius:100px;cursor:pointer;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent-2);color:var(--accent-2-ink);}
  .btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);}

  .section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:17px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
    padding-top:2px;
  }

  .month{margin-bottom:26px;}
  .month-head{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    padding:10px 0 8px;
    display:flex;align-items:baseline;gap:10px;
  }
  .month-head h2{
    font-family:var(--font-display);
    font-weight:800;
    font-size:27px;
    margin:0;
    letter-spacing:.2px;
    color:var(--accent);
  }
  .month-head .count{
    font-size:14.5px;color:var(--muted);font-weight:600;
  }

  .cards{display:flex;flex-direction:column;gap:10px;}

  .card{
    display:flex;gap:14px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  .card-date{
    flex:none;width:52px;text-align:center;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
  }
  .card-date .d{
    font-family:var(--font-display);
    font-weight:800;font-size:29px;line-height:1;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .card-date .m{
    font-size:12.5px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);
  }
  .card-img{
    flex:none;width:76px;height:76px;border-radius:12px;
    background:var(--surface-2);object-fit:cover;
    border:1px solid var(--line);
  }
  .card-img.placeholder{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:25px;
    color:var(--muted);
  }
  .card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center;}
  .card-artist{
    font-family:var(--font-display);
    font-weight:700;font-size:20px;line-height:1.15;
    overflow-wrap:anywhere;
  }
  .card-venue{
    font-size:15.5px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;gap:4px;
  }
  .card-venue .pin{width:11px;height:11px;flex:none;color:var(--accent-2);}
  .card-cta{
    appearance:none;border:none;font-family:var(--font-body);cursor:pointer;
    margin-top:7px;
    display:inline-flex;align-items:center;gap:5px;
    font-size:14.5px;font-weight:700;color:var(--accent-2-ink);
    background:var(--accent-2);
    padding:5px 12px 5px 10px;border-radius:100px;
    text-decoration:none;width:fit-content;
  }
  .card-cta svg{width:12px;height:12px;flex:none;}
  .badge-cancelled{
    margin-top:7px;
    display:inline-flex;align-items:center;gap:5px;
    font-size:13.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, transparent);
    padding:5px 12px;border-radius:100px;width:fit-content;
  }
  .card.is-cancelled{opacity:.62;}
  .card.is-cancelled .card-img,.card.is-cancelled .card-img.placeholder{filter:grayscale(.5);}

  /* Repère "Nouveau" — événements ajoutés depuis la dernière visite */
  .card-artist{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .badge-new{
    display:inline-flex;align-items:center;
    font-family:var(--font-body);font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;background:var(--teal-deep);
    padding:3px 9px;border-radius:100px;
  }
  .hero-badge-new{
    display:inline-flex;align-items:center;flex:none;
    font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    color:#fff;background:var(--teal-deep);
    padding:4px 11px;border-radius:100px;
  }

  .card{cursor:pointer;transition:transform .12s ease;}
  .card:active{transform:scale(.985);}
  .hero{cursor:pointer;}
  .card:focus-visible,.hero:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;}

  /* Modal: visuel en entier + réservation */
  .modal-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(15,20,20,.62);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-overlay[hidden]{display:none;}
  @media (min-width:640px){ .modal-overlay{align-items:center;padding:24px;} }
  .modal-panel{
    position:relative;
    background:var(--surface);
    width:100%;max-width:480px;
    max-height:92vh;overflow-y:auto;
    border-radius:24px 24px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.35);
    animation:modal-in .2s ease;
  }
  @media (min-width:640px){ .modal-panel{border-radius:24px;} }
  @keyframes modal-in{ from{transform:translateY(28px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .modal-close{
    position:absolute;top:12px;right:12px;z-index:2;
    width:36px;height:36px;border-radius:50%;
    background:rgba(20,16,10,.55);color:#fff;border:none;
    font-size:25px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  /* Affiche réduite : le contenu (vidéo, date, bouton) reste visible dès
     l'ouverture, sans avoir à défiler. Un toucher sur l'affiche l'agrandit. */
  .modal-poster{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;height:min(38vh,340px);padding:12px;box-sizing:border-box;border:0;
    background:var(--surface-2);border-radius:24px 24px 0 0;overflow:hidden;
    cursor:zoom-in;font-family:var(--font-body);
  }
  .modal-poster-bg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(24px) saturate(1.15);opacity:.6;}
  #modal-image-wrap .modal-poster img{
    position:relative;width:auto;max-width:100%;height:100%;object-fit:contain;
    border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  }
  .poster-zoom{
    position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(20,16,10,.72);color:#fff;font-weight:700;font-size:14px;
    padding:7px 12px 7px 10px;border-radius:100px;
  }
  .poster-zoom svg{width:16px;height:16px;flex:none;}
  .modal-poster:focus-visible{outline:3px solid var(--accent-2);outline-offset:-3px;}
  .lightbox{
    position:fixed;inset:0;z-index:200;background:rgba(8,10,10,.97);
    display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;cursor:zoom-out;
  }
  .lightbox[hidden]{display:none;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;}
  .lightbox-close{
    position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.18);color:#fff;border:none;font-size:30px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-body{padding:18px 22px 28px;}

  /* Vignette "Vidéo en LSF" — en haut du formulaire, avant tout le reste */
  .video-badge-btn{
    appearance:none;border:none;background:none;padding:0;margin-bottom:18px;cursor:pointer;
    text-decoration:none;
    display:inline-flex;align-items:center;gap:16px;
  }
  .video-badge-img-wrap{position:relative;width:88px;height:88px;flex:none;}
  .video-badge-img-wrap img{width:100%;height:100%;display:block;}
  .video-badge-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.45);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .video-badge-play svg{width:9px;height:9px;margin-left:1px;}
  .video-badge-btn:active .video-badge-img-wrap{transform:scale(.94);}
  .video-badge-label{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink);text-align:left;line-height:1.3;}
  .video-badge-label small{display:block;font-family:var(--font-body);font-size:15.5px;font-weight:600;color:var(--muted);}

  .modal-eyebrow{
    font-size:13.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--accent);margin-bottom:5px;
  }
  .modal-title{
    font-family:var(--font-display);font-weight:800;font-size:30px;
    margin:0 0 6px;line-height:1.05;
  }
  .modal-meta{font-size:16.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
  .reminder-btn{
    appearance:none;font-family:var(--font-body);text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;padding:13px 18px;border-radius:100px;margin-bottom:14px;
    background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line);
    font-weight:700;font-size:16px;cursor:pointer;box-sizing:border-box;
  }
  .reminder-btn svg{width:17px;height:17px;flex:none;}
  .reminder-btn:active{background:var(--surface);}
  .modal-cta{
    appearance:none;border:none;font-family:var(--font-body);
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px 18px;border-radius:100px;
    background:var(--accent-2);color:var(--accent-2-ink);
    font-weight:700;font-size:17px;text-decoration:none;
    box-sizing:border-box;text-align:center;cursor:pointer;
  }
  .modal-cta svg{width:15px;height:15px;flex:none;}
  .modal-cta .addr{overflow-wrap:anywhere;}
  .modal-cta.is-copied{background:var(--accent);color:var(--accent-ink);}
  .modal-note{
    display:block;text-align:center;color:var(--muted);
    font-size:16px;padding:12px 0;
  }
  body.modal-open{overflow:hidden;}

  /* Message prêt à envoyer (aide à l'écriture) */
  .modal-message{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .modal-message-title{
    font-family:var(--font-display);font-weight:800;font-size:19px;
    margin:0 0 4px;color:var(--ink);
  }
  .modal-message-sub{font-size:14.5px;color:var(--muted);margin:0 0 14px;line-height:1.4;}
  .places-stepper{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;font-size:16px;font-weight:700;color:var(--ink);
  }
  .stepper-controls{display:flex;align-items:center;gap:14px;}
  .stepper-controls button{
    appearance:none;border:none;width:34px;height:34px;border-radius:50%;
    background:var(--surface-2);color:var(--ink);font-size:21px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper-controls button:active{transform:scale(.92);}
  .stepper-count{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:18px;}
  .field-label{display:block;font-size:14.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field-input{
    width:100%;box-sizing:border-box;padding:11px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-family:var(--font-body);font-size:16.5px;margin-bottom:16px;
  }
  .field-input:focus{outline:2px solid var(--accent-2);outline-offset:1px;border-color:var(--accent-2);}
  .places-stepper + .places-stepper{margin-top:10px;}
  .stepper-group{margin-bottom:16px;}
  .stepper-group-title{
    font-size:14px;font-weight:800;color:var(--accent-2-ink,var(--accent-2));
    text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;
  }
  .message-preview{
    white-space:pre-wrap;font-family:var(--font-body);font-size:15.5px;line-height:1.55;
    background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:16px 0 12px;color:var(--ink);max-height:220px;overflow-y:auto;
  }
  .modal-copy-message{
    appearance:none;border:none;font-family:var(--font-body);cursor:pointer;
    display:block;width:100%;padding:13px 16px;border-radius:100px;
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16.5px;
  }
  .modal-copy-message.is-copied{background:var(--accent-2);color:var(--accent-2-ink);}

  /* Étapes "Préparer votre mail" — pictogrammes + libellés courts,
     pensés pour un public sourd très visuel et peu à l'aise en lecture. */
  .msg-step{margin-bottom:22px;}
  .msg-step-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .msg-step-icon{
    flex:none;width:34px;height:34px;border-radius:50%;
    background:var(--accent-2);color:var(--accent-2-ink);
    display:flex;align-items:center;justify-content:center;
  }
  .msg-step-icon svg{width:18px;height:18px;}
  .msg-step-label{font-family:var(--font-display);font-weight:800;font-size:17.5px;color:var(--ink);}
  .msg-step-hint{font-size:15.5px;color:var(--muted);margin:0 0 10px;line-height:1.5;}
  .msg-address-chip{
    display:block;background:var(--surface-2);border:2px dashed var(--accent-2);
    border-radius:14px;padding:13px 16px;font-weight:800;font-size:17px;
    color:var(--ink);text-align:center;overflow-wrap:anywhere;margin:0;
  }

  .empty{
    text-align:center;
    padding:52px 24px 40px;
    color:var(--muted);
  }
  .empty .mark{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;}
  .empty h2{
    font-family:var(--font-display);
    font-size:23px;font-weight:700;color:var(--ink);margin:0 0 8px;
  }
  .empty p{font-size:16.5px;line-height:1.5;max-width:36ch;margin:0 auto;}

  /* Petit mot festif tout en bas de la liste, pour donner envie de revenir */
  .coming-soon{
    position:relative;overflow:hidden;

const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function parseLocalDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d);
}
function startOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function isMailto(link){
  return typeof link === "string" && (link.startsWith("mailto:") || (link.includes("@") && !link.startsWith("http")));
}
function normalizeLink(link){
  if(!link) return null;
  if(link.startsWith("mailto:") || link.startsWith("http")) return link;
  if(link.includes("@")) return "mailto:" + link;
  return "https://" + link;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* Repère "Nouveau" + pastille sur l'icône de l'appli installée, pour les
   concerts ajoutés depuis la dernière visite. Purement côté navigateur
   (localStorage + Badging API) : ça ne prévient personne activement quand
   l'appli est fermée, seulement au moment où la personne la rouvre — une
   vraie notification poussée demanderait un serveur d'envoi, hors de
   portée d'une page statique. Voir aussi : navigator.setAppBadge (Badging
   API), supportée sur appli installée (Android/Chrome, desktop, iOS 16.4+). */
const SEEN_EVENTS_KEY = "chansigne_seen_event_ids_v1";

function getSeenEventIds(){
  // null = première visite (aucun historique) : on ne veut pas marquer
  // tous les concerts déjà en ligne comme "Nouveau" dans ce cas.
  try {
    const raw = localStorage.getItem(SEEN_EVENTS_KEY);
    return raw ? new Set(JSON.parse(raw)) : null;
  } catch(err){
    return null;
  }
}
function setSeenEventIds(ids){
  try { localStorage.setItem(SEEN_EVENTS_KEY, JSON.stringify(Array.from(ids))); }
  catch(err){ /* stockage indisponible (navigation privée…) : tant pis */ }
}
function updateAppBadge(count){
  try {
    if(count > 0 && "setAppBadge" in navigator) navigator.setAppBadge(count);
    else if("clearAppBadge" in navigator) navigator.clearAppBadge();
  } catch(err){ /* Badging API non dispo (appli non installée, navigateur non compatible…) */ }
}

function render(){
  const today = startOfToday();
  const upcoming = EVENTS
    .filter(e => parseLocalDate(e.date) >= today)
    .sort((a,b) => a.date.localeCompare(b.date) || (a.time||"").localeCompare(b.time||""));

  const seenIds = getSeenEventIds();
  const isFirstVisit = seenIds === null;
  const newIds = isFirstVisit
    ? new Set()
    : new Set(upcoming.filter(e => !e.cancelled && !e.soon && !seenIds.has(e.id)).map(e => e.id));
  updateAppBadge(newIds.size);
  if(isFirstVisit) setSeenEventIds(new Set(upcoming.map(e => e.id)));

  const heroSlot = document.getElementById("hero-slot");
  const listSlot = document.getElementById("list-slot");

  if(upcoming.length === 0){
    heroSlot.innerHTML = "";
    listSlot.innerHTML = `
      <div class="empty">
        <div class="mark"><img src="icon-512.png" alt="" style="width:100%;height:100%;"></div>
        <h2>Aucun concert programmé pour l'instant</h2>
        <p>Les prochains concerts chansignés apparaîtront ici dès qu'ils seront ajoutés. Revenez bientôt !</p>
      </div>`;
    return;
  }

  const next = upcoming.find(e => !e.cancelled && !e.soon);

  if(next){
    const nextLink = normalizeLink(next.link);
    const d = parseLocalDate(next.date);
    const dateStr = `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()].toLowerCase()}${timeText(next) ? " · " + timeText(next) : ""}`;

    heroSlot.innerHTML = `
      <div class="hero" data-id="${next.id}" tabindex="0" role="button" aria-label="Voir l'affiche et réserver : ${escapeHtml(next.artist)}">
        ${next.image
          ? `<div class="hero-bg" style="background-image:url('${next.image}')"></div><div class="hero-scrim"></div>`
          : `<div class="hero-noimg"></div>`}
        ${heroDoodle}
        <div class="hero-confetti"><span></span><span></span><span></span></div>
        <div class="hero-inner">
          <div class="hero-eyebrow-row">
            <span class="hero-eyebrow"><span class="dot"></span>Prochain concert</span>
            ${newIds.has(next.id) ? '<span class="hero-badge-new">Nouveau</span>' : ''}
          </div>
          <div class="hero-title">${escapeHtml(next.artist)}</div>
          <div class="hero-meta">
            <span>${escapeHtml(dateStr)}</span>

          </div>
        </div>
      </div>`;
  } else {
    heroSlot.innerHTML = "";
  }

  const byMonth = new Map();
  for(const e of upcoming){
    const dt = parseLocalDate(e.date);

    if(!byMonth.has(key)) byMonth.set(key, {label: MOIS[dt.getMonth()] + " " + dt.getFullYear(), items: []});

  let html = "";
  for(const {label, items} of byMonth.values()){
    html += `<div class="month">
      <div class="month-head"><h2>${label}</h2><span class="count">${items.length} concert${items.length>1?"s":""}</span></div>
      <div class="cards">`;
    for(const e of items){
      const dt = parseLocalDate(e.date);
      if(e.soon){
        // Concert encore confidentiel : seule la date est visible, la carte
        // n'est pas cliquable (pas de data-id, pas de rôle bouton).
        html += `
        <div class="card is-soon" aria-label="Concert le ${dt.getDate()} ${MOIS[dt.getMonth()].toLowerCase()} : annonce prochainement">
          <div class="card-date"><div class="d">${dt.getDate()}</div><div class="m">${MOIS_ABBR[dt.getMonth()]}</div></div>
          <div class="card-img soon-ph" aria-hidden="true"></div>
          <div class="card-body"><div class="soon-label">Annonce prochainement</div></div>
        </div>`;
        continue;
      }
      const link = e.cancelled ? null : normalizeLink(e.link);
      html += `
        <div class="card${e.cancelled ? " is-cancelled" : ""}" data-id="${e.id}" tabindex="0" role="button" aria-label="Voir l'affiche et réserver : ${escapeHtml(e.artist)}">
          <div class="card-date"><div class="d">${dt.getDate()}</div><div class="m">${MOIS_ABBR[dt.getMonth()]}</div></div>
          ${e.image
            ? `<img class="card-img" src="${e.image}" alt="">`
            : `<div class="card-img placeholder">${escapeHtml((e.artist||"?").charAt(0))}</div>`}
          <div class="card-body">
            <div class="card-artist">${escapeHtml(e.artist)}${newIds.has(e.id) ? '<span class="badge-new">Nouveau</span>' : ''}</div>
            <div class="card-venue">${iconPin}${escapeHtml(e.venue)}${e.city ? ", " + escapeHtml(e.city) : ""}${timeText(e) ? " · " + escapeHtml(timeText(e)) : ""}</div>
            ${e.cancelled
              ? `<span class="badge-cancelled">Annulé</span>`
              : (link ? `<button type="button" class="card-cta">${iconTicket} ${escapeHtml(e.linkLabel || "Réserver")}</button>` : (e.note ? `<span class="card-cta" style="color:var(--muted);background:none;padding:0;">${escapeHtml(e.note)}</span>` : ``))}
          </div>
        </div>`;
    }
    html += `</div></div>`;
  }
  listSlot.innerHTML = html;

  // Laisse le repère "Nouveau" et la pastille sur l'icône visibles un
  // moment, puis marque ces concerts comme vus pour la prochaine visite.
  if(newIds.size > 0){
    setTimeout(() => {
      setSeenEventIds(new Set(upcoming.map(e => e.id)));
      updateAppBadge(0);
    }, 4000);
  }
}

/* Copie dans le presse-papier, avec repli pour les navigateurs qui
   n'ont pas l'API Clipboard (ou la refusent hors contexte sécurisé). */
async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch(err){
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch(err2){
      return false;
    }
  }
}

/* Message pré-rempli, pensé pour les personnes sourdes qui ont du mal
   à rédiger : il suffit de le copier et de l'envoyer tel quel. */
function buildReservationMessage(artist, pshAdults, pshChildren, companionAdults, companionChildren, name){
  const pa = Math.max(0, pshAdults);
  const pc = Math.max(0, pshChildren);
  const ca = Math.max(0, companionAdults);
  const cc = Math.max(0, companionChildren);
  const who = name && name.trim() ? `Je m'appelle ${name.trim()}, je` : "Je";

  const pshLines = [];
  if(pa > 0) pshLines.push(`- ${pa} adulte${pa > 1 ? "s" : ""}`);
  if(pc > 0) pshLines.push(`- ${pc} enfant${pc > 1 ? "s" : ""}`);

  const companionLines = [];
  if(ca > 0) companionLines.push(`- ${ca} adulte${ca > 1 ? "s" : ""} valide${ca > 1 ? "s" : ""} ou en situation de handicap`);
  if(cc > 0) companionLines.push(`- ${cc} enfant${cc > 1 ? "s" : ""} valide${cc > 1 ? "s" : ""} ou en situation de handicap`);

  const pshBlock = pshLines.length
    ? `\nPlaces au tarif PSH :\n${pshLines.join("\n")}\n`
    : "";

  const companionBlock = companionLines.length
    ? `\nPlaces accompagnants :\n${companionLines.join("\n")}\n`
    : "";

  const signature = name && name.trim() ? `Bien cordialement.\n${name.trim()}` : "Bien cordialement.";

  return `Bonjour,

${who} suis sourd(e), je souhaite réserver des places pour le concert chansigné de ${artist}.
${pshBlock}${companionBlock}
Merci de m'indiquer :
- comment acheter mes places.
- où me rendre le jour J, et à quelle heure, pour assister au concert chansigné.
- s'il y a des gilets vibrants, où les récupérer.

Pour faciliter ma compréhension, merci de privilégier une réponse claire et avec des phrases simples.

En vous remerciant.
${signature}`;
}

/* Rappel calendrier — sans serveur, sans fichier téléchargé (les pages
   publiées ici ne peuvent pas proposer de téléchargement de fichier aux
   visiteurs : le navigateur bloque tout data:/blob: déclenché par la page).
   Solution fiable : un lien "Ajouter à Google Agenda" prérempli, qui
   fonctionne comme un lien de réservation classique. Les horaires sont
   convertis en UTC en tenant compte de l'heure d'été/hiver française. */
// Horaire affiché : heure précise (time) ou libellé libre (timeLabel, ex. "Soirée")
function timeText(e){ return e.time || e.timeLabel || ""; }
function pad2(n){ return String(n).padStart(2,"0"); }
function parisUtcOffsetHours(y, m, d){
  // Règle européenne : heure d'été du dernier dimanche de mars (UTC+2)
  // au dernier dimanche d'octobre (retour à UTC+1).
  function lastSundayUTC(year, monthIndex){
    const last = new Date(Date.UTC(year, monthIndex + 1, 0));
    last.setUTCDate(last.getUTCDate() - last.getUTCDay());
    return last.getTime();
  }
  const check = Date.UTC(y, m, d);
  const dstStart = lastSundayUTC(y, 2);  // mars
  const dstEnd = lastSundayUTC(y, 9);    // octobre
  return (check >= dstStart && check < dstEnd) ? 2 : 1;
}
function buildGoogleCalendarUrl(e){
  const dt = parseLocalDate(e.date);
  const y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
  const text = `${e.artist} — concert chansigné`;
  const details = "Concert traduit en langue des signes par 10 Doigts en Cavale.";
  const location = [e.venue, e.city].filter(Boolean).join(", ");

  let datesParam;
  if(e.time){
    const [h, min] = e.time.split(":").map(Number);
    const offset = parisUtcOffsetHours(y, m, d);
    const startMs = Date.UTC(y, m, d, h, min) - offset * 3600000;
    const endMs = startMs + 2 * 3600000; // durée par défaut : 2h
    const fmt = ms => {
      const u = new Date(ms);
      return `${u.getUTCFullYear()}${pad2(u.getUTCMonth()+1)}${pad2(u.getUTCDate())}T${pad2(u.getUTCHours())}${pad2(u.getUTCMinutes())}00Z`;
    };
    datesParam = `${fmt(startMs)}/${fmt(endMs)}`;
  } else {
    const end = new Date(y, m, d + 1);
    const fmtDate = dd => `${dd.getFullYear()}${pad2(dd.getMonth()+1)}${pad2(dd.getDate())}`;
    datesParam = `${fmtDate(dt)}/${fmtDate(end)}`;
  }

  const params = new URLSearchParams({ action: "TEMPLATE", text, dates: datesParam, details, location });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

  container.addEventListener("click", ev => {

    if(!card) return;
    ev.preventDefault();
    openModal(card.dataset.id);
  });

/* Installation sur l'écran d'accueil (PWA). Un lien web ne peut pas "télécharger"
   une appli à lui seul : sur Android le navigateur propose l'installation
   (bouton natif si disponible), sur iPhone il faut passer par Partager →
   "Sur l'écran d'accueil". Le bouton affiche donc la bonne marche à suivre. */
(function(){
  try {
    const wrap = document.getElementById("install-wrap");
    const btn = document.getElementById("install-btn");
    const help = document.getElementById("install-help");
    if(!wrap || !btn || !help) return;
    const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    if(standalone) return;
    const again = document.getElementById("install-again");
    const dismissBtn = document.getElementById("install-dismiss");
    const KEY = "agenda-install-dismissed";
    const getDismissed = () => { try { return localStorage.getItem(KEY) === "1"; } catch(e) { return false; } };
    const setDismissed = v => { try { if(v) localStorage.setItem(KEY, "1"); else localStorage.removeItem(KEY); } catch(e) {} };
    const render = dismissed => {
      wrap.hidden = dismissed;
      if(again) again.hidden = !dismissed;
      if(dismissed) help.hidden = true;
    };
    render(getDismissed());
    if(dismissBtn) dismissBtn.addEventListener("click", () => { setDismissed(true); render(true); });
    if(again) again.addEventListener("click", ev => { ev.preventDefault(); setDismissed(false); render(false); window.scrollTo({top:0,behavior:"smooth"}); });
    let deferred = null;
    window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); deferred = ev; });
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    const stepsIOS = '<p><strong>Sur iPhone / iPad (Safari) :</strong></p><p>1. Touchez le bouton <strong>Partager</strong> (le carré avec une flèche vers le haut).</p><p>2. Choisissez <strong>« Sur l\'écran d\'accueil »</strong>.</p><p>3. Touchez <strong>Ajouter</strong>.</p>';
    const stepsAndroid = '<p><strong>Sur Android (Chrome) :</strong></p><p>1. Touchez le menu <strong>⋮</strong> en haut à droite.</p><p>2. Choisissez <strong>« Installer l\'application »</strong> (ou « Ajouter à l\'écran d\'accueil »).</p><p>3. Confirmez.</p>';
    // Samsung Internet : son installateur d'applis web produit un paquet jugé
    // "non sécurisé" par Google Play Protect (Android 14+), ce qui bloque
    // l'installation. Chrome n'a pas ce problème : on y renvoie la personne.
    const isSamsung = /SamsungBrowser/i.test(ua) && isAndroid;
    const chromeIntent = "intent://" + location.host + location.pathname + location.search +
      "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(location.href) + ";end";
    const stepsSamsung = '<p><strong>Vous utilisez Samsung Internet.</strong> Ce navigateur affiche une alerte de sécurité (Google Play Protect) et bloque l\'installation.</p><p>Touchez <strong>« Installer avec Chrome »</strong> : la page s\'ouvre dans Google Chrome, où l\'installation se fait sans alerte.</p><p>Si Chrome ne s\'ouvre pas, installez <strong>Google Chrome</strong> depuis le Play Store, puis rouvrez ce lien.</p>';
    if(isSamsung){
      const label = document.getElementById("install-label");
      if(label) label.textContent = "Installer avec Chrome";
      btn.dataset.chromeIntent = chromeIntent;
      help.innerHTML = stepsSamsung;
      help.hidden = false;
    }
    btn.addEventListener("click", async () => {
      if(isSamsung){ window.location.href = chromeIntent; return; }
      if(deferred){
        try { deferred.prompt(); await deferred.userChoice; } catch(e) {}
        deferred = null;
        return;
      }
      help.innerHTML = isIOS ? stepsIOS : (isAndroid ? stepsAndroid : stepsAndroid + stepsIOS);
      help.hidden = !help.hidden;
    });
  } catch(err) { /* l'aide à l'installation n'est pas essentielle */ }
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
